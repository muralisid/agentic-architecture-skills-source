<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Finding a video is not finding the event</title><desc id="desc">One label for the recording: “Unsafe behavior in loading bay.”: The recording lasts one hour. The label does not locate the event.: A reviewer must search again.; A bounded event to review: Camera 3 · 14:02:11–14:02:18: Keep the clip and surrounding context. The event label is a hypothesis.: A reviewer can inspect the claim.. Generated descriptions help discovery. The original interval supports verification.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Finding a video is not finding the event</text><rect x="24" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9f452e">One label for the recording</text><text x="44" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">“Unsafe behavior in loading</text><text x="44" y="236" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">bay.”</text><text x="44" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">The recording lasts one hour. The</text><text x="44" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">label does not locate the event.</text><text x="44" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">A reviewer must search again.</text><rect x="518" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="538" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#276f70">A bounded event to review</text><text x="538" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">Camera 3 · 14:02:11–14:02:18</text><text x="538" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Keep the clip and surrounding</text><text x="538" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">context. The event label is a</text><text x="538" y="340" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">hypothesis.</text><text x="538" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">A reviewer can inspect the claim.</text><text x="28" y="540" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Generated descriptions help discovery. The original interval supports</text><text x="28" y="569" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">verification.</text></svg>