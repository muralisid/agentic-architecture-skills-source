<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="t d"><title id="t">Combine evidence from separate representations</title><desc id="d">Image, time-series, and text retrieval produce evidence matched by asset, place, time, and permission before a decision.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Combine the evidence</text><rect x="28" y="92" width="335" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="129" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Images</text><text x="46" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find visually similar events</text><path d="M195.5 196 V235 L560 279" fill="none" stroke="#a14630" stroke-width="2"/><rect x="393" y="92" width="335" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="411" y="129" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Sensor readings</text><text x="411" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find similar operating periods</text><path d="M560.5 196 V235 L560 279" fill="none" stroke="#a14630" stroke-width="2"/><rect x="758" y="92" width="335" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="776" y="129" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Maintenance records</text><text x="776" y="165" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find relevant facts and actions</text><path d="M925.5 196 V235 L560 279" fill="none" stroke="#a14630" stroke-width="2"/><rect x="195" y="285" width="730" height="138" rx="14" fill="white" stroke="#d3dbd7"/><text x="215" y="320" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">Match asset, place, and time</text><text x="215" y="353" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Keep access permissions and source links.</text><text x="215" y="393" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Check contradictions before drawing a conclusion.</text><text x="28" y="470" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#263f43">Retrieve separately. Verify together.</text><text x="28" y="501" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">Unrelated vector spaces cannot be compared</text><text x="28" y="532" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">by distance just because their sizes match.</text><text x="28" y="563" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">Alignment needs training or explicit fusion.</text></svg>