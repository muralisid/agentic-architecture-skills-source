<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 910" role="img" aria-labelledby="title desc"><title id="title">A summary is still derived from a source</title><desc id="desc">Only protect the document: Restricted incident report: The report is removed, but its copied summary remains searchable.: The restriction has not propagated.; Track every derived copy: Source → index → summary: Carry access rules and source versions. Remove or restrict affected copies.: The answer respects source access.. A memory design needs an update path for derived information as well as originals.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">A summary is still derived</text><text x="28" y="77" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">from a source</text><rect x="24" y="125" width="432" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9f452e">Only protect the document</text><text x="44" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">Restricted incident report</text><text x="44" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">The report is removed, but its</text><text x="44" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">copied summary remains</text><text x="44" y="340" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">searchable.</text><text x="44" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">The restriction has not</text><text x="44" y="404" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">propagated.</text><rect x="24" y="473" width="432" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="507" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#276f70">Track every derived copy</text><text x="44" y="551" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">Source → index → summary</text><text x="44" y="630" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Carry access rules and source</text><text x="44" y="659" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">versions. Remove or restrict</text><text x="44" y="688" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">affected copies.</text><text x="44" y="723" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">The answer respects source</text><text x="44" y="752" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">access.</text><text x="28" y="830" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">A memory design needs an update</text><text x="28" y="859" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">path for derived information as</text><text x="28" y="888" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">well as originals.</text></svg>