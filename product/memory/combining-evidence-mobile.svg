<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 955" role="img" aria-labelledby="t d"><title id="t">Combine evidence from separate representations</title><desc id="d">Image, time-series, and text retrieval produce evidence matched by asset, place, time, and permission before a decision.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Combine the evidence</text><rect x="28" y="85" width="424" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="122" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Images</text><text x="46" y="158" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find visually similar events</text><rect x="28" y="217" width="424" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="254" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Sensor readings</text><text x="46" y="290" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find similar operating periods</text><rect x="28" y="349" width="424" height="104" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Maintenance records</text><text x="46" y="422" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Find relevant facts and actions</text><rect x="28" y="515" width="424" height="138" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="550" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">Match asset, place, and time</text><text x="46" y="583" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Keep access permissions and source links.</text><text x="46" y="623" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Check contradictions before drawing a</text><text x="46" y="643" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">conclusion.</text><text x="28" y="715" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#263f43">Retrieve separately. Verify together.</text><text x="28" y="746" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">Unrelated vector spaces cannot be compared</text><text x="28" y="777" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">by distance just because their sizes match.</text><text x="28" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">Alignment needs training or explicit fusion.</text></svg>