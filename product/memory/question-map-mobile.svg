<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1100" role="img" aria-labelledby="title desc"><title id="title">One pump, different questions</title><desc id="desc">Exact records establish identity; document versions establish procedure; time-series comparisons find similar behavior; relationships trace dependencies; media preserves an observation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263f43">One pump, different questions</text><rect x="24" y="110" width="432" height="160" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="145" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Which pump is this?</text><text x="44" y="191" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Exact asset record</text><text x="44" y="226" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Identity, serial number, location</text><rect x="24" y="292" width="432" height="160" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="327" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What procedure applies?</text><text x="44" y="373" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Document + current version</text><text x="44" y="408" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Applicable instructions and dates</text><rect x="24" y="474" width="432" height="160" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="509" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Has it behaved like this?</text><text x="44" y="555" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Time-series comparison</text><text x="44" y="590" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Shape, duration, operating state</text><rect x="24" y="656" width="432" height="160" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="691" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What else depends on it?</text><text x="44" y="737" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Relationships or joins</text><text x="44" y="772" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Connected assets and work</text><rect x="24" y="838" width="432" height="160" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="873" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What did the camera see?</text><text x="44" y="919" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Media + event interval</text><text x="44" y="954" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">The original observation</text></svg>