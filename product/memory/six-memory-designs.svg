<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="t d"><title id="t">Six memory designs</title><desc id="d">Six alternatives, with a pump maintenance example for each. They can be combined.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Six memory designs</text><rect x="28" y="100" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="128" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">01</text><text x="46" y="161" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Original records</text><text x="46" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep the source words</text><text x="46" y="214" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Pump inspection reports</text><rect x="393" y="100" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="411" y="128" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">02</text><text x="411" y="161" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Extracted facts</text><text x="411" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep selected statements</text><text x="411" y="214" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Bearing replaced on 12 May</text><rect x="758" y="100" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="776" y="128" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">03</text><text x="776" y="161" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Relationships</text><text x="776" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Connect things and events</text><text x="776" y="214" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Pump → bearing → work order</text><rect x="28" y="325" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="353" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">04</text><text x="46" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Summaries</text><text x="46" y="413" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep a shorter account</text><text x="46" y="439" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Recent maintenance history</text><rect x="393" y="325" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="411" y="353" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">05</text><text x="411" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Agent notes</text><text x="411" y="413" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep task observations</text><text x="411" y="439" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Checks already completed</text><rect x="758" y="325" width="335" height="194" rx="14" fill="white" stroke="#d3dbd7"/><text x="776" y="353" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">06</text><text x="776" y="386" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Learned representations</text><text x="776" y="413" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Encode patterns in a model</text><text x="776" y="439" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Recognise a fault signature</text><text x="28" y="614" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263f43">Choose what must remain recoverable.</text><text x="28" y="645" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">These designs can be combined.</text></svg>