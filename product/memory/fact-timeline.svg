<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">Facts change with events</title><desc id="desc">An inspection on 12 May finds a fault, a repair on 14 May changes the situation, and a question on 18 May needs current evidence while preserving the old inspection as history.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Two records can disagree without either being wrong</text><rect x="28" y="130" width="300" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="46" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">12 May</text><text x="46" y="206" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Inspection records</text><text x="46" y="237" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">a fault</text><text x="46" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Bearing B2 on pump P-17</text><path d="M331 220 L352 220" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="130" width="300" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="373" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">14 May</text><text x="373" y="206" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Repair is confirmed</text><text x="373" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Work order W-204 is</text><text x="373" y="296" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">complete</text><path d="M658 220 L679 220" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><rect x="682" y="130" width="300" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="700" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">18 May</text><text x="700" y="206" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Agent asked about</text><text x="700" y="237" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">current condition</text><text x="700" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Old fault ≠ current</text><text x="700" y="296" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">fault</text><text x="28" y="415" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">Keep the old inspection as history. Link the repair and check what is</text><text x="28" y="447" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">true now.</text><text x="28" y="515" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Retrieval must answer the date in the question, not simply return the most</text><text x="28" y="544" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">similar sentence.</text></svg>