<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 940" role="img" aria-labelledby="t d"><title id="t">Compare time-series behavior</title><desc id="d">Three illustrative signals show similar shapes at different magnitudes and the same peak over different durations. Keep original units and times.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">What should “similar” mean?</text><rect x="28" y="90" width="424" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="44" y="120" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Current pump</text><text x="44" y="147" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Last 30 minutes</text><path d="M50 182 V269 H434" fill="none" stroke="#889b98"/><polyline points="50.0,269 77.07142857142857,265 104.14285714285714,269 131.21428571428572,261 158.28571428571428,265 185.35714285714286,253 212.42857142857142,261 239.5,241 266.57142857142856,257 293.6428571428571,229 320.7142857142857,253 347.7857142857143,197 374.85714285714283,249 401.92857142857144,249 429.0,253" fill="none" stroke="#a14630" stroke-width="3"/><text x="50" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><rect x="28" y="325" width="424" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="44" y="355" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Past pump A</text><text x="44" y="382" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Similar shape, different magnitude</text><path d="M50 417 V504 H434" fill="none" stroke="#889b98"/><polyline points="50.0,504 77.07142857142857,500 104.14285714285714,504 131.21428571428572,496 158.28571428571428,500 185.35714285714286,488 212.42857142857142,496 239.5,476 266.57142857142856,492 293.6428571428571,464 320.7142857142857,488 347.7857142857143,432 374.85714285714283,484 401.92857142857144,484 429.0,488" fill="none" stroke="#246e71" stroke-width="3"/><text x="50" y="525" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><rect x="28" y="560" width="424" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="44" y="590" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Past pump B</text><text x="44" y="617" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Same peak, longer duration</text><path d="M50 652 V739 H434" fill="none" stroke="#889b98"/><polyline points="50.0,739 77.07142857142857,739 104.14285714285714,735 131.21428571428572,735 158.28571428571428,735 185.35714285714286,727 212.42857142857142,667 239.5,667 266.57142857142856,667 293.6428571428571,667 320.7142857142857,667 347.7857142857143,727 374.85714285714283,731 401.92857142857144,735 429.0,735" fill="none" stroke="#746395" stroke-width="3"/><text x="50" y="760" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><text x="28" y="815" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Illustrative signals, independently scaled.</text><text x="28" y="838" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Keep units, sampling interval, and duration.</text><text x="28" y="861" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Search for comparable periods.</text><text x="28" y="884" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Check source readings and confirmed outcomes.</text><text x="28" y="907" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Similar shape does not prove the same cause.</text></svg>