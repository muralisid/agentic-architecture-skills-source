<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">Compare time-series behavior</title><desc id="d">Three illustrative signals show similar shapes at different magnitudes and the same peak over different durations. Keep original units and times.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">What should “similar” mean?</text><rect x="28" y="95" width="335" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="44" y="125" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Current pump</text><text x="44" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Last 30 minutes</text><path d="M50 187 V274 H345" fill="none" stroke="#889b98"/><polyline points="50.0,274 70.71428571428572,270 91.42857142857143,274 112.14285714285714,266 132.85714285714286,270 153.57142857142856,258 174.28571428571428,266 195.0,246 215.71428571428572,262 236.42857142857142,234 257.1428571428571,258 277.8571428571429,202 298.57142857142856,254 319.2857142857143,254 340.0,258" fill="none" stroke="#a14630" stroke-width="3"/><text x="50" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><rect x="393" y="95" width="335" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="409" y="125" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Past pump A</text><text x="409" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Similar shape, different</text><text x="409" y="171" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">magnitude</text><path d="M415 187 V274 H710" fill="none" stroke="#889b98"/><polyline points="415.0,274 435.7142857142857,270 456.42857142857144,274 477.14285714285717,266 497.8571428571429,270 518.5714285714286,258 539.2857142857143,266 560.0,246 580.7142857142858,262 601.4285714285714,234 622.1428571428571,258 642.8571428571429,202 663.5714285714286,254 684.2857142857142,254 705.0,258" fill="none" stroke="#246e71" stroke-width="3"/><text x="415" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><rect x="758" y="95" width="335" height="211" rx="14" fill="white" stroke="#d3dbd7"/><text x="774" y="125" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Past pump B</text><text x="774" y="152" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#263f43">Same peak, longer duration</text><path d="M780 187 V274 H1075" fill="none" stroke="#889b98"/><polyline points="780.0,274 800.7142857142857,274 821.4285714285714,270 842.1428571428571,270 862.8571428571429,270 883.5714285714286,262 904.2857142857143,202 925.0,202 945.7142857142858,202 966.4285714285714,202 987.1428571428571,202 1007.8571428571429,262 1028.5714285714287,266 1049.2857142857142,270 1070.0,270" fill="none" stroke="#746395" stroke-width="3"/><text x="780" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#263f43" xml:space="preserve">Earlier                         Later</text><text x="28" y="373" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">Illustrative signals, independently scaled. Keep units, sampling interval, and duration.</text><text x="28" y="421" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">Search similar periods → read the source data → check the confirmed outcome.</text><text x="28" y="475" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Similar shape does not prove the same cause.</text></svg>