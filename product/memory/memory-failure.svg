<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A relevant answer can still be wrong</title><desc id="desc">A shared pile of text: “Replace the bearing.”: A similar report mentions P-71. It is from before the repair.: Similarity hides the mismatch.; Evidence for this task: “Check P-17 before deciding.”: Match the asset and dates. Read current vibration and repair records.: The missing evidence is visible.. A useful memory must connect the answer to the right asset, time, and source.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">A relevant answer can still be wrong</text><rect x="24" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9f452e">A shared pile of text</text><text x="44" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">“Replace the bearing.”</text><text x="44" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">A similar report mentions P-71. It</text><text x="44" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">is from before the repair.</text><text x="44" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Similarity hides the mismatch.</text><rect x="518" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="538" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#276f70">Evidence for this task</text><text x="538" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">“Check P-17 before deciding.”</text><text x="538" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Match the asset and dates. Read</text><text x="538" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">current vibration and repair</text><text x="538" y="340" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">records.</text><text x="538" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">The missing evidence is visible.</text><text x="28" y="540" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">A useful memory must connect the answer to the right asset, time, and</text><text x="28" y="569" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">source.</text></svg>