<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1110" role="img" aria-labelledby="t d"><title id="t">Six memory designs</title><desc id="d">Six alternatives, with a pump maintenance example for each. They can be combined.</desc><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Six memory designs</text><rect x="28" y="90" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="118" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">01</text><text x="46" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Original records</text><text x="46" y="178" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep the source words</text><text x="46" y="204" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Pump inspection reports</text><rect x="28" y="242" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="270" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">02</text><text x="46" y="303" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Extracted facts</text><text x="46" y="330" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep selected statements</text><text x="46" y="356" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Bearing replaced on 12 May</text><rect x="28" y="394" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="422" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">03</text><text x="46" y="455" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Relationships</text><text x="46" y="482" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Connect things and events</text><text x="46" y="508" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Pump → bearing → work order</text><rect x="28" y="546" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="574" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">04</text><text x="46" y="607" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Summaries</text><text x="46" y="634" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep a shorter account</text><text x="46" y="660" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Recent maintenance history</text><rect x="28" y="698" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="726" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">05</text><text x="46" y="759" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Agent notes</text><text x="46" y="786" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Keep task observations</text><text x="46" y="812" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Checks already completed</text><rect x="28" y="850" width="424" height="130" rx="14" fill="white" stroke="#d3dbd7"/><text x="46" y="878" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a14630">06</text><text x="46" y="911" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Learned representations</text><text x="46" y="938" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Encode patterns in a model</text><text x="46" y="964" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263f43">Recognise a fault signature</text><text x="28" y="1044" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263f43">Choose what must remain recoverable.</text><text x="28" y="1075" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263f43">These designs can be combined.</text></svg>