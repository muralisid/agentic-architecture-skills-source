<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 825" role="img" aria-labelledby="title desc"><title id="title">One pump, different questions</title><desc id="desc">Exact records establish identity; document versions establish procedure; time-series comparisons find similar behavior; relationships trace dependencies; media preserves an observation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263f43">One pump, different questions</text><rect x="24" y="110" width="952" height="112" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="145" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Which pump is this?</text><path d="M435 162 L500 162" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="148" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Exact asset record</text><text x="525" y="189" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">Identity, serial number, location</text><rect x="24" y="243" width="952" height="112" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="278" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What procedure applies?</text><path d="M435 295 L500 295" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="281" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Document + current version</text><text x="525" y="322" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">Applicable instructions and dates</text><rect x="24" y="376" width="952" height="112" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="411" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Has it behaved like this?</text><path d="M435 428 L500 428" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="414" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Time-series comparison</text><text x="525" y="455" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">Shape, duration, operating state</text><rect x="24" y="509" width="952" height="112" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="544" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What else depends on it?</text><path d="M435 561 L500 561" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="547" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Relationships or joins</text><text x="525" y="588" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">Connected assets and work</text><rect x="24" y="642" width="952" height="112" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="677" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">What did the camera see?</text><path d="M435 694 L500 694" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="680" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Media + event interval</text><text x="525" y="721" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263f43">The original observation</text></svg>