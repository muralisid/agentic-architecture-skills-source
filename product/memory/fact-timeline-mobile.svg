<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1010" role="img" aria-labelledby="title desc"><title id="title">Facts change with events</title><desc id="desc">An inspection on 12 May finds a fault, a repair on 14 May changes the situation, and a question on 18 May needs current evidence while preserving the old inspection as history.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Two records can disagree</text><text x="28" y="77" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">without either being wrong</text><rect x="30" y="130" width="420" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="48" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">12 May</text><text x="48" y="206" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Inspection records a fault</text><text x="48" y="269" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Bearing B2 on pump P-17</text><path d="M240 315 L240 337" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="345" width="420" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="48" y="379" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">14 May</text><text x="48" y="421" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Repair is confirmed</text><text x="48" y="484" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Work order W-204 is complete</text><path d="M240 530 L240 552" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="560" width="420" height="180" rx="16" fill="#fff" stroke="#ced8d5"/><text x="48" y="594" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9f452e">18 May</text><text x="48" y="636" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">Agent asked about current</text><text x="48" y="667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#263f43">condition</text><text x="48" y="699" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Old fault ≠ current fault</text><text x="28" y="830" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">Keep the old inspection as</text><text x="28" y="862" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">history. Link the repair and</text><text x="28" y="894" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">check what is true now.</text><text x="28" y="930" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Retrieval must answer the date in</text><text x="28" y="959" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">the question, not simply return the</text><text x="28" y="988" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">most similar sentence.</text></svg>