<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">How research changes the guide</title><desc id="desc">Question: State what is uncertain. Comparison: Use a credible baseline. Experiment: Measure successes and failures. Interpretation: Keep scope and limitations. Guidance: Update affected advice. Planned investigations are labeled as questions, not presented as completed experiments.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">How research changes the guide</text><rect x="28.0" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Question</text><text x="44.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">State what is</text><text x="44.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">uncertain</text><path d="M220.8 219 H235.8" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="240.8" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="256.8" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="256.8" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Comparison</text><text x="256.8" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use a credible</text><text x="256.8" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">baseline</text><path d="M433.6 219 H448.6" fill="none" stroke="#9a4c2d" 