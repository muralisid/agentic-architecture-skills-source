<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 965" role="img" aria-labelledby="title desc"><title id="title">How research changes the guide</title><desc id="desc">Question: State what is uncertain. Comparison: Use a credible baseline. Experiment: Measure successes and failures. Interpretation: Keep scope and limitations. Guidance: Update affected advice. Planned investigations are labeled as questions, not presented as completed experiments.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">How research changes the guide</text><rect x="28" y="100" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="126" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Question</text><text x="44" y="179" font-family="Arial,sans-serif" font-size="16" fill="#465958">State what is uncertain</text><path d="M240 230 V250" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="258" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="44" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Comparison</text><text x="44" y="337" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use a credible baseline</text><path d="M240 388 V408" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="416" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="442" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="44" y="466" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Experiment</text><text x="44" y="495" font-family="Arial,sans-serif" font-size="16" fill="#465958">Measure successes and failures</text><path d="M240 546 V566" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="574" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="44" y="624" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Interpretation</text><text x="44" y="653" font-family="Arial,sans-serif" font-size="16" fill="#465958">Keep scope and limitations</text><path d="M240 704 V724" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="732" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="758" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">05</text><text x="44" y="782" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Guidance</text><text x="44" y="811" font-family="Arial,sans-serif" font-size="16" fill="#465958">Update affected advice</text><text x="28" y="920" font-family="Arial,sans-serif" font-size="15" fill="#465958">Planned investigations are labeled as questions,</text><text x="28" y="940" font-family="Arial,sans-serif" font-size="15" fill="#465958">not presented as completed experiments.</text></svg>