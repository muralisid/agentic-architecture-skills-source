<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2618" role="img" aria-labelledby="title desc">
<title id="title">Billing exceptions: who does what</title>
<desc id="desc">An implausible read or failed bill reaches the exception list, and the agent first checks for hardship, disconnection or a payment plan. If it finds one, a trained person decides and the agent stops. Otherwise the agent gathers evidence and proposes a resolution, and a fixed rule releases it only within the cap and flags. A specialist approves the rest, every release is logged, a sample is checked, and the model never releases.</desc>
<defs>
<marker id="ah9a4c2d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a4c2d"/></marker>
</defs>
<rect x="0" y="0" width="720" height="2618" fill="#f8f5ef"/>
<text x="28" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#182e31">Billing exceptions: who does what</text>
<text x="28" y="113" font-family="Arial,sans-serif" font-size="24" fill="#465958">Proposed design. The agent proposes. A fixed rule</text>
<text x="28" y="144" font-family="Arial,sans-serif" font-size="24" fill="#465958">or a person approves every change.</text>
<rect x="28" y="195" width="664" height="165" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<rect x="48" y="215" width="208.8" height="38" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="242.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Billing system</text>
<text x="48" y="288.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#182e31">Exception list</text>
<text x="48" y="330.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Implausible read or failed bill</text>
<path d="M360 364 V398" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<rect x="28" y="404" width="664" height="196" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<rect x="48" y="424" width="90" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="60" y="451.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48" y="497.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#881337">Hardship check</text>
<text x="48" y="539.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Any sign of hardship, disconnection or a</text>
<text x="48" y="570.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">payment plan?</text>
<path d="M600 604 V650" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="614" y="634" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d">yes</text>
<rect x="150" y="656" width="542" height="244" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="170" y="676" width="235.2" height="38" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="182" y="703.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Hardship officer</text>
<text x="170" y="749.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#78350f">A trained person decides</text>
<text x="170" y="791.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Checks capacity to pay. The agent</text>
<text x="170" y="822.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">hands over its evidence and stops.</text>
<rect x="170" y="842" width="169.2" height="38" rx="19" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="182" y="869.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#881337">Agent stops</text>
<path d="M70 604 V924" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="84" y="634" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d">no</text>
<rect x="28" y="930" width="664" height="196" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="48" y="950" width="90" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="60" y="977.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48" y="1023.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#4c1d95">Gather evidence</text>
<text x="48" y="1065.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Read history, meter events, past bills and</text>
<text x="48" y="1096.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">account notes.</text>
<path d="M360 1130 V1164" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<rect x="28" y="1170" width="664" height="196" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<rect x="48" y="1190" width="90" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="60" y="1217.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48" y="1263.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#4c1d95">Propose</text>
<text x="48" y="1305.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">One resolution, with its evidence and a</text>
<text x="48" y="1336.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">confidence level.</text>
<rect x="150" y="1392" width="542" height="196" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="170" y="1412" width="90" height="38" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="182" y="1439.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="170" y="1485.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#881337">The model never releases</text>
<text x="170" y="1527.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">A fixed rule or a specialist approves</text>
<text x="170" y="1558.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">every change.</text>
<path d="M70 1370 V1612" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<rect x="28" y="1618" width="664" height="196" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<rect x="48" y="1638" width="156" height="38" rx="19" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="60" y="1665.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Fixed rule</text>
<text x="48" y="1711.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Rule check</text>
<text x="48" y="1753.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Checks the confidence level, a cap on the bill</text>
<text x="48" y="1784.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">change, and no hardship or disconnection flag.</text>
<path d="M600 1818 V1864" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="614" y="1848" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d">fails</text>
<rect x="150" y="1870" width="542" height="165" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="170" y="1890" width="156" height="38" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="182" y="1917.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Specialist</text>
<text x="170" y="1963.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#78350f">Specialist approves</text>
<text x="170" y="2005.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Every case the rule does not release.</text>
<path d="M70 1818 V2085" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="84" y="1848" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d">passes</text>
<path d="M600 2039 V2085" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="586" y="2071" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d" text-anchor="end">approved</text>
<rect x="28" y="2091" width="664" height="196" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="48" y="2111" width="208.8" height="38" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="2138.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Billing system</text>
<text x="48" y="2184.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1e3a8a">Release logged</text>
<text x="48" y="2226.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">Every release, with its evidence and the rule</text>
<text x="48" y="2257.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">or person that approved it.</text>
<path d="M360 2291 V2325" fill="none" stroke="#9a4c2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9a4c2d)"/>
<text x="374" y="2317" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#9a4c2d">sample</text>
<rect x="28" y="2331" width="664" height="165" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="48" y="2351" width="156" height="38" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="60" y="2378.64" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Specialist</text>
<text x="48" y="2424.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#78350f">Sample checked</text>
<text x="48" y="2466.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">A sample of released cases.</text>
<text x="28" y="2546" font-family="Arial,sans-serif" font-size="24" fill="#465958">Proposed design. The placements and controls are</text>
<text x="28" y="2577" font-family="Arial,sans-serif" font-size="24" fill="#465958">this guide's position.</text>
</svg>
