<circle cx="68.0" cy="374.0" r="21" fill="#2563eb"/><text x="68.0" y="382.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<rect x="100.0" y="354.0" width="175.8" height="38.0" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="114.0" y="381.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Topic model</text>
<text x="48.0" y="428.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1e3a8a">Group</text>
<text x="48.0" y="464.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">A topic model groups findings exported from the</text>
<text x="48.0" y="495.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">audit system.</text>
<path d="M360.0 532.0 L360.0 564.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
