<text x="48.0" y="650.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#4c1d95">Explain</text>
<text x="48.0" y="686.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The agent states competing explanations, each</text>
<text x="48.0" y="717.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">with what would disprove it.</text>
<path d="M360.0 754.0 L360.0 786.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="792.0" width="664.0" height="213.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="68.0" cy="818.0" r="21" fill="#7c3aed"/><text x="68.0" y="826.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<rect x="100.0" y="798.0" width="95.2" height="38.0" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="114.0" y="825.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48.0" y="872.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#4c1d95">Check patterns</text>
<text x="48.0" y="908.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">It checks audit dates, auditors and template</text>
<text x="48.0" y="939.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">versions for copied wording or changed</text>
<text x="48.0" y="970.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">coverage.</text>
<path d="M360.0 1007.0 L360.0 1039.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="1045.0" width="664.0" height="274.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="68.0" cy="1071.0" r="21" fill="#7c3aed"/><text x="68.0" y="1079.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<rect x="100.0" y="1051.0" width="95.2" height="38.0" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="114.0" y="1078.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48.0" y="1125.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#4c1d95">Ask for evidence</text>
<text x="48.0" y="1161.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">It drafts requests for EAM history, inspection</text>
<text x="48.0" y="1192.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">records, procedure versions and closure</text>
<text x="48.0" y="1223.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">evidence.</text>
<path d="M64.0 1254.0 L78.0 1268.0 L64.0 1282.0 L50.0 1268.0 Z" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="90.0" y="1276.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">The assurance owner approves the request</text>
<text x="90.0" y="1307.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">list, or a rule allows internal requests.</text>
<path d="M360.0 1321.0 L360.0 1353.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="1359.0" width="664.0" height="182.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<rect x="48.0" y="1365.0" width="189.3" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="62.0" y="1392.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Owning teams</text>
<text x="48.0" y="1439.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Teams reply</text>
<text x="48.0" y="1475.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The owning teams reply with the records,</text>
<text x="48.0" y="1506.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">through the request queue.</text>
<path d="M360.0 1543.0 L360.0 1575.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="1581.0" width="664.0" height="182.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="68.0" cy="1607.0" r="21" fill="#7c3aed"/><text x="68.0" y="1615.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<rect x="100.0" y="1587.0" width="95.2" height="38.0" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="114.0" y="1614.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48.0" y="1661.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#4c1d95">Other sites</text>
<text x="48.0" y="1697.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The agent checks the same records at sites that</text>
<text x="48.0" y="1728.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">did not have the finding.</text>
