<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2587" role="img" aria-labelledby="title desc">
<title id="title">Recurring audit issues with an agent: who does what</title>
<desc id="desc">Swimlane of the proposed audit investigation, in seven steps across five lanes. The topic model groups findings from the audit system. The agent states competing explanations and what would disprove each. It checks for false patterns such as copied wording or changed scope. It drafts evidence requests. The assurance owner approves the request list, which is an approval. The owning teams reply with EAM, inspection and procedure records. The agent looks at sites without the finding, then reports support, uncertainty and gaps. The assurance owner decides and records any systemic issue in the audit system, which is an approval. The case store links every statement to its source.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a4c2d"/></marker></defs>
<rect x="0" y="0" width="720" height="2587" fill="#f8f5ef"/>
<text x="28.0" y="64.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Recurring audit issues with an agent:</text>
<text x="28.0" y="104.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">who does what</text>
<text x="28.0" y="148.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Proposed design. The agent tests explanations</text>
<text x="28.0" y="179.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">against records. A person writes the audit record.</text>
<rect x="28.0" y="198.0" width="28.0" height="26.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="68.0" y="220.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Agent step</text>
