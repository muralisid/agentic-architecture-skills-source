<rect x="28.0" y="1803.0" width="664.0" height="182.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="68.0" cy="1829.0" r="21" fill="#7c3aed"/><text x="68.0" y="1837.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<rect x="100.0" y="1809.0" width="95.2" height="38.0" rx="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="114.0" y="1836.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="48.0" y="1883.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#4c1d95">Report</text>
<text x="48.0" y="1919.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">A report on support, uncertainty and gaps. Each</text>
<text x="48.0" y="1950.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">statement links to its source.</text>
<path d="M360.0 1987.0 L360.0 2019.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="2025.0" width="664.0" height="213.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="68.0" cy="2051.0" r="21" fill="#d97706"/><text x="68.0" y="2059.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<rect x="100.0" y="2031.0" width="229.6" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="2058.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Assurance owner</text>
<path d="M658.0 2035.0 L673.0 2050.0 L658.0 2065.0 L643.0 2050.0 Z" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="48.0" y="2105.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Decide</text>
<text x="48.0" y="2141.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The assurance or engineering owner decides, and</text>
<text x="48.0" y="2172.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">records any systemic issue and its actions in</text>
<text x="48.0" y="2203.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">the audit system.</text>
<path d="M360.0 2240.0 L360.0 2272.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="2278.0" width="664.0" height="173.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="48.0" y="2318.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#134e4a">Case store</text>
<text x="48.0" y="2354.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Every statement links to its source record.</text>
<text x="48.0" y="2385.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Requests and replies are kept. The agent never</text>
<text x="48.0" y="2416.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">writes the audit record.</text>
<text x="28.0" y="2495.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The audit opinion, closing actions and anything</text>
<text x="28.0" y="2526.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">sent to the board stay with people.</text>
</svg>