<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Asset investigation with an agent: who does what</title>
<desc id="desc">Swimlane of the proposed asset investigation, in twelve steps across seven lanes. The agent opens a case from an APM alert, read through the read broker. It checks the sensor reading, how the unit ran, and recent work in EAM. Engineering tools do the calculations. Fixed rules check each finding against live data and past cases. The agent drafts a request for more evidence, which the engineer approves. The agent proposes a finding pack and a draft EAM notification. The engineer approves it and plans the work in EAM. The trading desk or planner changes the bid or forecast. The area authority issues the permit, which is an approval the agent has no path to. The engineer labels the finding accepted or rejected. The case store keeps every source, tool output, check and approval.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a4c2d"/></marker></defs>
