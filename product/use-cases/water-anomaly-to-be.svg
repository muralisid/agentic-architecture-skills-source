<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Water network anomaly with agents: who does what</title>
<desc id="desc">Swimlane of a water network anomaly with an agent. Four lanes are people: the team that owns the agent, water quality officer, engineer and crews, and control room operator. Two lanes are systems: the asset system and event console, and SCADA and the historian. The agent and the evidence store have their own lanes. A red dashed line separates the agent from SCADA. The agent reads a one-way copy through the DMZ and has no write path back. Steps 1 to 4: the agent receives the alarm copy, pulls trends, checks the sensor, and checks work and calls. Step 5: the agent proposes a view in the console, and the operator decides. Step 6: for a sensor fault, the agent drafts work and the operator or planner approves. Step 7: for a real issue, the engineer leads and approves. Step 8: the agent gathers lab results, and a named officer decides notices. Step 9: the owning team updates the reference set, with each change approved. The evidence store holds traces, the alarm journal and historian, the asset system audit trail and the logbook.</desc>
<rect x="0" y="0" width="1600" height="898" fill="#f8f5ef"/>
<text x="32.0" y="50.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Water network anomaly with agents: who does what</text>
<text x="1568.0" y="50.0" font-family="Arial,sans-serif" font-size="20" fill="#465958" text-anchor="end">The agent reads a copy. It never writes to OT.</text>
