<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Referral to appointment today</title>
<desc id="desc">Swimlanes for the GP and patient, the referral clerk, the clinician, the booking clerk and the systems. Step 1: the referral clerk receives a fax, secure message or e-referral. Step 2: the clerk finds the patient in the patient administration system (PAS). Step 3: the clerk registers the referral. Step 4: the clerk checks it is complete. Step 5: the clerk chases missing items, and the GP&#x27;s reply by fax goes back to step 1. Step 6: a clinician triages it. Step 7: the clerk keys in the triage result. Step 8: letters go to the patient and the GP. Step 9: the booking clerk phones the patient, books and sends an SMS reminder. Step 10: the data warehouse reports the waiting list. A blue box under each step names the system it uses.</desc>
