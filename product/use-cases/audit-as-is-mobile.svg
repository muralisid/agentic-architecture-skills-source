<text x="48.0" y="1944.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Decide fix</text>
<text x="48.0" y="1980.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The executive or standard owner changes a</text>
<text x="48.0" y="2011.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">standard or funds a program.</text>
