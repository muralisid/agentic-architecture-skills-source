<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2404" role="img" aria-labelledby="title desc">
<title id="title">Recurring audit issues today: who does what</title>
<desc id="desc">Swimlane of how recurring audit findings are handled today, in nine steps across five lanes. The assurance manager plans the annual program. Auditors audit and write a report. Findings are copied into the audit system by hand. Site owners are assigned actions and close them, often without a check. An assurance analyst groups findings by their words. The head of assurance reports repeats to the board. The executive decides on a systemic fix, which is an approval. Assurance checks it at the next audit, months later.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9a4c2d"/></marker></defs>
<rect x="0" y="0" width="720" height="2404" fill="#f8f5ef"/>
<text x="28.0" y="64.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Recurring audit issues today: who</text>
<text x="28.0" y="104.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">does what</text>
<text x="28.0" y="148.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Typical practice. Findings are grouped by their</text>
<text x="28.0" y="179.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">words, and the check comes a year later.</text>
<rect x="28.0" y="198.0" width="28.0" height="26.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="68.0" y="220.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Person</text>
<rect x="358.0" y="198.0" width="28.0" height="26.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="398.0" y="220.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">System</text>
