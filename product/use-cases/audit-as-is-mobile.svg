<rect x="100.0" y="1870.0" width="149.0" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="1897.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Executive</text>
