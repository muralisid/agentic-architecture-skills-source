<text x="48.0" y="1722.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Report</text>
<text x="48.0" y="1758.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The head of assurance reports repeat findings</text>
<text x="48.0" y="1789.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">and overdue actions to the board committee.</text>
<path d="M360.0 1826.0 L360.0 1858.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
