<rect x="100.0" y="1426.0" width="149.0" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="1453.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Assurance</text>
<text x="48.0" y="1500.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Find patterns</text>
<text x="48.0" y="1536.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">An assurance analyst groups findings by their</text>
<text x="48.0" y="1567.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">words, with keyword search or topic models.</text>
