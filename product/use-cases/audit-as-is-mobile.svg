<text x="68.0" y="258.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Approval</text>
<rect x="28.0" y="310.0" width="664.0" height="182.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="68.0" cy="336.0" r="21" fill="#d97706"/><text x="68.0" y="344.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<rect x="100.0" y="316.0" width="149.0" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="343.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Assurance</text>
<text x="48.0" y="390.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Plan</text>
<text x="48.0" y="426.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The assurance manager plans the annual audit</text>
<text x="48.0" y="457.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">program by site and topic.</text>
<path d="M360.0 494.0 L360.0 526.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="532.0" width="664.0" height="182.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="68.0" cy="558.0" r="21" fill="#d97706"/><text x="68.0" y="566.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<rect x="100.0" y="538.0" width="135.5" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="565.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Auditors</text>
<text x="48.0" y="612.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Audit</text>
<text x="48.0" y="648.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Internal or third-party auditors visit the site</text>
<text x="48.0" y="679.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">and write findings in a Word or PDF report.</text>
<path d="M360.0 716.0 L360.0 748.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="754.0" width="664.0" height="182.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="68.0" cy="780.0" r="21" fill="#2563eb"/><text x="68.0" y="788.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<rect x="100.0" y="760.0" width="189.3" height="38.0" rx="19" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="114.0" y="787.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Audit system</text>
<text x="48.0" y="834.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1e3a8a">Enter findings</text>
<text x="48.0" y="870.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Findings are copied into the audit system.</text>
<text x="48.0" y="901.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Severity and category are set by hand.</text>
<path d="M360.0 938.0 L360.0 970.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="976.0" width="664.0" height="182.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="68.0" cy="1002.0" r="21" fill="#d97706"/><text x="68.0" y="1010.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<rect x="100.0" y="982.0" width="175.8" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="1009.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Site owners</text>
<text x="48.0" y="1056.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Assign actions</text>
<text x="48.0" y="1092.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Each action gets a site owner and a due date in</text>
<text x="48.0" y="1123.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">the HSE action module.</text>
<path d="M360.0 1160.0 L360.0 1192.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="28.0" y="1198.0" width="664.0" height="182.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="68.0" cy="1224.0" r="21" fill="#d97706"/><text x="68.0" y="1232.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<rect x="100.0" y="1204.0" width="175.8" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="1231.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Site owners</text>
<text x="48.0" y="1278.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Close actions</text>
<text x="48.0" y="1314.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Site owners upload a document or a note.</text>
<text x="48.0" y="1345.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Actions are often closed without a check.</text>
<path d="M360.0 1382.0 L360.0 1414.0" fill="none" stroke="#9a4c2d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
