<circle cx="68.0" cy="2112.0" r="21" fill="#d97706"/><text x="68.0" y="2120.6" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
<rect x="100.0" y="2092.0" width="149.0" height="38.0" rx="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="114.0" y="2119.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Assurance</text>
<text x="48.0" y="2166.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#78350f">Check</text>
<text x="48.0" y="2202.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Assurance checks whether the fix worked at the</text>
<text x="48.0" y="2233.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">next audit cycle, months later.</text>
<text x="28.0" y="2312.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Annual program. Actions due in 30 to 90 days</text>
<text x="28.0" y="2343.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">(typical, unsourced).</text>
