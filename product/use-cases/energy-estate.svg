<text x="454.0" y="696.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">Copies plant data out</text>
<rect x="800.0" y="642.0" width="300.0" height="72.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="814.0" y="670.0" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">Read broker</text>
<text x="814.0" y="696.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">Serves the copy, read only</text>
