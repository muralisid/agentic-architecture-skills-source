<text x="44.0" y="1657.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">ERP, asset management (EAM), production and</text>
<text x="44.0" y="1688.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">metal accounting, trading and bidding, HSE,</text>
<text x="44.0" y="1719.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">permit to work</text>
<rect x="28.0" y="1750.0" width="664.0" height="154.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44.0" y="1784.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#182e31">Integration fabric (R03)</text>
<text x="44.0" y="1815.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">OPC servers, MQTT broker, integration platform,</text>
<text x="44.0" y="1846.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">market links (AEMO bidding), fleet and</text>
<text x="44.0" y="1877.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">telematics adapters</text>
<rect x="28.0" y="1908.0" width="664.0" height="154.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44.0" y="1942.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#182e31">Data platform (R02)</text>
<text x="44.0" y="1973.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Process historian, lab system (LIMS), fleet</text>
<text x="44.0" y="2004.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">database, geology and block models, lakehouse,</text>
<text x="44.0" y="2035.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">dashboards</text>
