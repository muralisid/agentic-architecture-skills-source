<text x="44.0" y="2100.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#182e31">Infrastructure and compute (R01)</text>
<text x="44.0" y="2131.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">Control-building servers, rugged computers on</text>
<text x="44.0" y="2162.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">trucks, private wireless, remote operations</text>
<text x="44.0" y="2193.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">centre, cloud</text>
