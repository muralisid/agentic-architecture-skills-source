<text x="44.0" y="1468.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Line of business and OT (R05)</text>
<text x="44.0" y="1499.0" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">Information side: asset performance, condition</text>
<text x="44.0" y="1530.0" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">monitoring, alarm management, fleet management,</text>
<text x="44.0" y="1561.0" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">mine planning</text>
