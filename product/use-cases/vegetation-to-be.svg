<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Vegetation inspection with agents: who does what</title>
<desc id="desc">Swimlane of vegetation inspection with an agent. Four lanes are people: compliance officer, network operations, field assessor and crew, and planner and asset data owner. Two lanes are systems: GIS and the asset system, and the imagery vendor platform. The agent and the evidence store have their own lanes. The vendor platform has new findings. Steps 1 to 4: the agent notices them, matches each to its asset, checks work and fire risk, and proposes. When an asset does not match, the asset data owner fixes the record. Step 5: the agent creates a notification marked agent proposed in the asset system. The planner approves the work order. Step 6: the field assessor confirms. Step 7: network operations arranges any outage and switching. The agent has no path to outage or switching systems. Step 8: the crew cuts. Steps 9 and 10: the agent checks close-out evidence and drafts the report. A supervisor and a named officer sign. The evidence store holds traces, the asset system audit trail, vendor logs and GIS edit history.</desc>
