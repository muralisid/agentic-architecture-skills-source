<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Named utility deployments by autonomy level</title>
<desc id="desc">Four columns: electricity networks, water and wastewater, customer service, and assurance and resilience. Rows run from assisted (A1) up to managed autonomy (A4). Vector, Watercare, Sydney Water, AGL and PG&amp;E sit at delegated tasks (A2). Essential Energy sits at assisted (A1). Kraken with Sierra sits at supervised autonomy (A3), with set account journeys at one utility. Nothing sits at A4. A line between A2 and A3 reads: below this line, the systems advise. Hollow dots mark proposed designs. Badges name the zone or rule each area touches. Electricity and water touch safety actuation. Customer service touches the money zone and decisions about people. Assurance touches formal regulatory records.</desc>
<defs>
</defs>
