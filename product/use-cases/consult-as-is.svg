<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Preparing for a multidisciplinary meeting today</title>
<desc id="desc">Swimlanes for outside providers, the MDT coordinator, the registrar, radiology and pathology, the MDT and chair, and the systems. Step 1: the coordinator lists the patients in a spreadsheet. Step 2: the coordinator gathers results from several screens. Step 3: the radiologist sets up images. Step 4: the pathologist reviews slides. Step 5: the coordinator chases outside reports, which often arrive late. Step 6: the registrar writes the case summary by copy and paste. Step 7: the MDT meets and discusses. Step 8: the chair signs the outcome, and it goes to the EMR and the GP. Step 9: the data warehouse reports activity. A blue box under each step names the system it uses.</desc>
