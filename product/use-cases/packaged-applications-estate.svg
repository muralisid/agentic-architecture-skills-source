<text x="32" y="96" font-family="Arial,sans-serif" font-size="20" fill="#465958">Each box is a packaged system. Its badges show what vendors ship for it.</text>
<rect x="32" y="110" width="1536" height="56" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="54" y="146" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#4c1d95">The join: an outage message and a work order need billing, outage, GIS and field</text>
<text x="1546" y="146" font-family="Arial,sans-serif" font-size="19" fill="#4c1d95" text-anchor="end">No vendor covers it. Strongest build candidate.</text>
