<text x="599" y="307.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">Read history,</text>
<text x="599" y="330.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">meter events,</text>
<text x="599" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">bills, notes</text>
<rect x="792" y="250" width="179" height="122" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
