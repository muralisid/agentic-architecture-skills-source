<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Billing exceptions: who does what</title>
<desc id="desc">An implausible read or failed bill reaches the exception list, and the agent first checks for hardship, disconnection or a payment plan. If it finds one, a trained person decides and the agent stops. Otherwise the agent gathers evidence and proposes a resolution, and a fixed rule releases it only within the cap and flags. A specialist approves the rest, every release is logged, a sample is checked, and the model never releases.</desc>
