<text x="374" y="691.1" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#78350f">A trained person decides</text>
<text x="374" y="721.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">Checks capacity to pay. The agent hands over its evidence</text>
<text x="374" y="744.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">and stops.</text>
