<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Follow-up after discharge today</title>
<desc id="desc">Swimlanes for the GP and community services, the treating team, clerks and the systems. Step 1: the treating team agrees actions in free text, and a junior doctor writes the discharge summary. Step 2: the EMR sends it to My Health Record and the GP. Step 3: a clerk requests a review appointment. Step 4: a doctor orders tests that a community lab will do. Step 5: a nurse refers the patient to community services, whose intake keys it in again. Step 6: the responsible doctor watches pending results. Step 7: a nurse phones some patients. Step 8: no one checks the work was done. Step 9: a clerk handles missed appointments. Step 10: the data warehouse reports. A blue box under each step names the system it uses.</desc>
