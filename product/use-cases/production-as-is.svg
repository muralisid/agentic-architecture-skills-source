<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Production measurement today: who does what</title>
<desc id="desc">Swimlane of how a production gap is handled today, in eleven steps across six lanes. The fleet system logs every truck load. Belt scales record plant tonnes in the historian, and the lab assays grade and moisture. Cameras and surveyors estimate volumes. The mine engineer builds the daily report in Excel and spots a gap above the tolerance. The metallurgist chases the cause by email and phone, and proposes an adjustment. The manager approves it. Month end runs a survey and a mass balance. Finance and the competent person sign the formal reports, which is an approval.</desc>
