<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Safety coaching with an agent: who does what</title>
<desc id="desc">Swimlane of the proposed safety coaching flow, in eight steps across six lanes. The agent takes the detector event. A vision tool checks the label against the clip, read by ID only. The agent checks the permit, the roster and the site procedure, then drafts a coaching note and a labelled teaching video with faces blurred. The safety owner approves every item in the HSE system, which is an approval. The identity check confirms the recipient, which is an approval. The supervisor delivers the coaching. The agent tracks whether the behaviour comes back. The evidence store keeps the original clip unchanged, the coaching item, its approver and the agent log.</desc>
