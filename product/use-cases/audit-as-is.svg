<text x="32.0" y="54.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Recurring audit issues today: who does what</text>
<text x="32.0" y="88.0" font-family="Arial,sans-serif" font-size="20" fill="#465958">Typical practice. Findings are grouped by their words, and the check comes a year later.</text>
