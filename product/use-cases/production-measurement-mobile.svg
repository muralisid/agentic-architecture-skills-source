<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 965" role="img" aria-labelledby="title desc"><title id="title">Investigate production discrepancies</title><desc id="desc">Measure: Calibrated visual estimate. Compare: Scales and production records. Investigate: Find the missing explanation. Review: Resolve uncertain evidence. Reconcile: Record the accepted result. Proposed agent extension. Each action remains within an explicitly permitted business process.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Investigate production</text><text x="28" y="69" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">discrepancies</text><rect x="28" y="100" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="126" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Measure</text><text x="44" y="179" font-family="Arial,sans-serif" font-size="16" fill="#465958">Calibrated visual estimate</text><path d="M240 230 V250" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="258" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="44" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Compare</text><text x="44" y="337" font-family="Arial,sans-serif" font-size="16" fill="#465958">Scales and production records</text><path d="M240 388 V408" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="416" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="442" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="44" y="466" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Investigate</text><text x="44" y="495" font-family="Arial,sans-serif" font-size="16" fill="#465958">Find the missing explanation</text><path d="M240 546 V566" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="574" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="44" y="624" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Review</text><text x="44" y="653" font-family="Arial,sans-serif" font-size="16" fill="#465958">Resolve uncertain evidence</text><path d="M240 704 V724" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="732" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="758" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">05</text><text x="44" y="782" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Reconcile</text><text x="44" y="811" font-family="Arial,sans-serif" font-size="16" fill="#465958">Record the accepted result</text><text x="28" y="920" font-family="Arial,sans-serif" font-size="15" fill="#465958">Proposed agent extension. Each action remains</text><text x="28" y="940" font-family="Arial,sans-serif" font-size="15" fill="#465958">within an explicitly permitted business process.</text></svg>