<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2670" role="img" aria-labelledby="title desc">
<title id="title">Vegetation inspection with agents: who does what</title>
<desc id="desc">Swimlane of vegetation inspection with an agent. Four lanes are people: compliance officer, network operations, field assessor and crew, and planner and asset data owner. Two lanes are systems: GIS and the asset system, and the imagery vendor platform. The agent and the evidence store have their own lanes. The vendor platform has new findings. Steps 1 to 4: the agent notices them, matches each to its asset, checks work and fire risk, and proposes. When an asset does not match, the asset data owner fixes the record. Step 5: the agent creates a notification marked agent proposed in the asset system. The planner approves the work order. Step 6: the field assessor confirms. Step 7: network operations arranges any outage and switching. The agent has no path to outage or switching systems. Step 8: the crew cuts. Steps 9 and 10: the agent checks close-out evidence and drafts the report. A supervisor and a named officer sign. The evidence store holds traces, the asset system audit trail, vendor logs and GIS edit history.</desc>
<rect x="0" y="0" width="720" height="2670" fill="#f8f5ef"/>
<text x="24.0" y="48.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Vegetation inspection with agents: who</text>
<text x="24.0" y="88.0" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">does what</text>
<text x="24.0" y="138.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">The agent writes one thing: a proposed</text>
<text x="24.0" y="170.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">notification. Nothing is cut or switched on an</text>
<text x="24.0" y="202.0" font-family="Arial,sans-serif" font-size="24" fill="#465958">image alone.</text>
<rect x="24" y="236" width="672" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<rect x="44" y="254" width="44" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="112.0" y="282.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">Imagery vendor platform</text>
<text x="112.0" y="316.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">New findings arrive.</text>
