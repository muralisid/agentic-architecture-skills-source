<text x="112.0" y="458.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Notices them through the vendor API or an</text>
<text x="112.0" y="490.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">MCP connector.</text>
