<text x="112.0" y="598.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="112.0" y="632.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Matches each finding to the asset in GIS</text>
<text x="112.0" y="664.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">and the asset system.</text>
<polygon points="124,677 135,688 124,699 113,688" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="148.0" y="696.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">The asset data owner fixes any mismatch</text>
<path d="M66 730 V752" fill="none" stroke="#475569" stroke-width="3"/>
<polygon points="66,760 58,748 74,748" fill="#475569"/>
<rect x="24" y="764" width="672" height="136" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="66" cy="804" r="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="66.0" y="813.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95" text-anchor="middle">3</text>
<text x="112.0" y="810.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="112.0" y="844.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Checks open work, recent cuts, planned</text>
<text x="112.0" y="876.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">outages and fire danger.</text>
<path d="M66 904 V926" fill="none" stroke="#475569" stroke-width="3"/>
<polygon points="66,934 58,922 74,922" fill="#475569"/>
<rect x="24" y="938" width="672" height="136" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="66" cy="978" r="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="66.0" y="987.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95" text-anchor="middle">4</text>
<text x="112.0" y="984.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="112.0" y="1018.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Ranks spans and proposes inspections with</text>
<text x="112.0" y="1050.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">image date and resolution.</text>
<path d="M66 1078 V1100" fill="none" stroke="#475569" stroke-width="3"/>
<polygon points="66,1108 58,1096 74,1096" fill="#475569"/>
<rect x="24" y="1112" width="672" height="174" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="66" cy="1152" r="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="66.0" y="1161.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95" text-anchor="middle">5</text>
<text x="112.0" y="1158.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#4c1d95">Agent</text>
<text x="112.0" y="1192.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Creates a notification marked agent</text>
<text x="112.0" y="1224.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">proposed. This write makes it Tier 2.</text>
