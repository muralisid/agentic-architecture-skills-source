<text x="112.0" y="1550.0" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#78350f">Network operations</text>
<text x="112.0" y="1584.0" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Arranges any outage and switching. The</text>
