<text x="199.3" y="876.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">New for agents</text>
<rect x="367.90000000000003" y="860" width="22" height="20" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
<text x="397.9" y="876.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">Controls</text>
<rect x="507.1" y="860" width="22" height="20" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="537.1" y="876.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">Evidence</text>
<rect x="646.3" y="860" width="22" height="20" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
<text x="676.3" y="876.0" font-family="Arial,sans-serif" font-size="18" fill="#465958">No agent write path</text>
<text x="1568.0" y="876.0" font-family="Arial,sans-serif" font-size="18" fill="#465958" text-anchor="end">Typical estate, not a survey of one utility</text>
