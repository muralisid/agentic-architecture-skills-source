<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Vegetation inspection today: who does what</title>
<desc id="desc">Swimlane of vegetation inspection at an electricity distributor today. Five lanes are people: compliance, network operations, programme manager and planner, capture contractor, and field assessor and crew. One lane is the imagery vendor platform. Step 1: the programme manager plans the cycle. Step 2: the contractor captures imagery. Step 3: the vendor platform measures clearance. Steps 4 and 5: the planner reviews at the desk and types in work orders, which the planner approves. Step 6: a field assessor confirms the finding. Step 7: network operations arranges an outage, and the operator approves switching. Step 8: the crew cuts, and a supervisor signs off. Step 9: the work is closed and the contract manager approves payment. Step 10: compliance audits and reports, and a named officer signs.</desc>
