<text x="300" y="658" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">A record of what was said</text>
<line x1="826" y1="650" x2="934" y2="650" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<rect x="940" y="130" width="400" height="600" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
<text x="966" y="176" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Shared platform</text>
<text x="966" y="208" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">capabilities</text>
<rect x="966" y="236" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="277" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Knowledge</text>
<rect x="966" y="316" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="357" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Identity</text>
<rect x="966" y="396" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="437" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Tools</text>
<rect x="966" y="476" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="517" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Evaluations</text>
<rect x="966" y="556" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="597" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Monitoring</text>
<rect x="966" y="636" width="348" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="990" y="677" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">Model access</text>
<rect x="1390" y="330" width="180" height="170" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="1480" y="382" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#4c1d95">Every other</text>
<text x="1480" y="412" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#4c1d95">agent uses</text>
<text x="1480" y="442" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#4c1d95">the same</text>
<text x="1480" y="472" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#4c1d95">capabilities</text>
<line x1="1388" y1="415" x2="1346" y2="415" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-agent)"/>
<text x="40" y="800" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">Separate what customer exposure makes different. Share the rest.</text>
<text x="40" y="840" font-family="Arial,sans-serif" font-size="22" fill="#182e31">Running a second copy of a shared capability is a defect. Legal exposure is the reason for the edge.</text>
</svg>
