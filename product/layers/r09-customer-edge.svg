<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">A customer edge on shared platform capabilities</title>
<desc id="desc">Customers reach the organisation by phone, chat, app and web. They meet the customer edge, which is built separately. The edge holds five parts. They are voice and chat channels, AI disclosure and consent, and hand-over with the conversation's state. The last two are hardening against anonymous attackers and a record of what was said. Arrows lead from each part to one shared box, the shared platform capabilities. They are knowledge, identity, tools, evaluations, monitoring and model access. Every other agent uses the same shared capabilities. The line underneath says separate what customer exposure makes different, and share the rest.</desc>
<defs><marker id="ah-system" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-human" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-agent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>

<text x="40" y="60" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">A customer edge on shared platform capabilities</text>
<text x="40" y="100" font-family="Arial,sans-serif" font-size="22" fill="#182e31">What the agent says is the company speaking, so the customer-facing parts are built separately.</text>
<rect x="40" y="330" width="160" height="170" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
<text x="120" y="392" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#78350f">Customers</text>
<text x="120" y="428" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#78350f">phone, chat,</text>
<text x="120" y="456" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#78350f">app and web</text>
<line x1="202" y1="415" x2="244" y2="415" stroke="#d97706" stroke-width="3" marker-end="url(#ah-human)"/>
<rect x="250" y="130" width="600" height="600" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="276" y="176" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Customer edge</text>
<text x="276" y="206" font-family="Arial,sans-serif" font-size="20" fill="#1e3a8a">Built separately</text>
<rect x="276" y="226" width="548" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="274" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">Voice and chat channels</text>
<line x1="826" y1="266" x2="934" y2="266" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<rect x="276" y="322" width="548" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="370" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">AI disclosure and consent</text>
<line x1="826" y1="362" x2="934" y2="362" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<rect x="276" y="418" width="548" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="466" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">Hand-over with the conversation's state</text>
<line x1="826" y1="458" x2="934" y2="458" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<rect x="276" y="514" width="548" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="562" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">Hardening against anonymous attackers</text>
