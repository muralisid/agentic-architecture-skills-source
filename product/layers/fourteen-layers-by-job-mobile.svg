<text x="66" y="1169.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="110" y="1154" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Control and check them</text>
<text x="110" y="1188" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Identity, rules, traces</text>
<rect x="60" y="1220" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1265" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R10</tspan><tspan dx="16">Security and identity</tspan></text>
<rect x="60" y="1304" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1349" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R11</tspan><tspan dx="16">Governance, risk and sovereignty</tspan></text>
<rect x="60" y="1388" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1433" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R12</tspan><tspan dx="16">Observability and FinOps</tspan></text>
<rect x="20" y="1492" width="680" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="1540.0" r="26" fill="#475569"/>
<text x="66" y="1549.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="110" y="1534" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Improve them</text>
<text x="110" y="1568" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Tests and safe change</text>
<rect x="60" y="1600" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1645" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R06</tspan><tspan dx="16">Intelligence and learning</tspan></text>
<rect x="20" y="1704" width="680" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="1752.0" r="26" fill="#475569"/>
<text x="66" y="1761.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="110" y="1746" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Work with people</text>
<text x="110" y="1780" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Where people meet agents</text>
<rect x="60" y="1812" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1857" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R08</tspan><tspan dx="16">Productivity and collaboration</tspan></text>
<rect x="60" y="1896" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="1941" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R09</tspan><tspan dx="16">Experience and channels</tspan></text>
