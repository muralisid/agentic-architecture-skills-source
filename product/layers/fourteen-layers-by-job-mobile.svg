<text x="84" y="2025" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R13</tspan><tspan dx="16">Operating model and supervision</tspan></text>
<text x="360" y="2104" font-family="Arial,sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">Every agent touches several layers at once.</text>
<text x="360" y="2140" font-family="Arial,sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">Each layer has its own page.</text>
