<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2174" width="720" height="2174" role="img" aria-labelledby="title desc">
<title id="title">The fourteen layers, grouped by the job they do</title>
<desc id="desc">Six groups of layers. Run the agents: infrastructure and compute (R01) and the agent platform (R07). Let them act: integration fabric (R03), systems of record (R04), and line of business and OT (R05). Give them knowledge: data platform (R02) and agent data engineering (R14). Control and check them: security and identity (R10), governance, risk and sovereignty (R11), and observability and FinOps (R12). Improve them: intelligence and learning (R06). Work with people: productivity and collaboration (R08), experience and channels (R09), and operating model and supervision (R13). Every agent touches several layers at once.</desc>
<rect x="0" y="0" width="720" height="2174" fill="#f8f5ef"/>
<text x="360" y="62" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31" text-anchor="middle">The fourteen layers,</text>
<text x="360" y="102" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31" text-anchor="middle">grouped by the job they do</text>
<rect x="20" y="140" width="680" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="188.0" r="26" fill="#475569"/>
<text x="66" y="197.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="110" y="182" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Run the agents</text>
<text x="110" y="216" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Where agents run</text>
<rect x="60" y="248" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="293" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R01</tspan><tspan dx="16">Infrastructure and compute</tspan></text>
<rect x="60" y="332" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="377" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R07</tspan><tspan dx="16">Agent platform</tspan></text>
<rect x="20" y="436" width="680" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="484.0" r="26" fill="#475569"/>
<text x="66" y="493.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="110" y="478" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Let them act</text>
<text x="110" y="512" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">How agents reach systems</text>
<rect x="60" y="544" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="589" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R03</tspan><tspan dx="16">Integration fabric</tspan></text>
<rect x="60" y="628" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="673" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R04</tspan><tspan dx="16">Systems of record</tspan></text>
<rect x="60" y="712" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="757" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R05</tspan><tspan dx="16">Line of business and OT</tspan></text>
<rect x="20" y="816" width="680" height="96" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="864.0" r="26" fill="#475569"/>
<text x="66" y="873.0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="110" y="858" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">Give them knowledge</text>
<text x="110" y="892" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">What agents may read</text>
<rect x="60" y="924" width="640" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="969" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a"><tspan font-weight="bold">R02</tspan><tspan dx="16">Data platform</tspan></text>
