<rect x="56" y="1060" width="292" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="80" y="1101" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Tools</text>
<rect x="372" y="1060" width="292" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="396" y="1101" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Evaluations</text>
<rect x="56" y="1140" width="292" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="80" y="1181" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Monitoring</text>
<rect x="372" y="1140" width="292" height="64" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="396" y="1181" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Model access</text>
<rect x="30" y="1276" width="660" height="70" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
<text x="56" y="1320" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">Every other agent uses them too</text>
<line x1="360" y1="1274" x2="360" y2="1238" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-agent)"/>
<text x="30" y="1400" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182e31">Separate what customer exposure</text>
<text x="30" y="1434" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182e31">makes different. Share the rest.</text>
