<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1250" role="img" aria-labelledby="title desc"><title id="title">Match the failure to the intervention</title><desc id="desc">Unclear tasks suggest instructions; missing evidence suggests context; missing capabilities suggest tools; residual behavior failures may justify adaptation; expensive demonstrated capability may justify distillation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263f43">What is stopping this task?</text><rect x="24" y="115" width="432" height="187" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">The task is unclear</text><text x="44" y="218" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Clarify instructions</text><text x="44" y="260" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Keep the goal and output testable.</text><rect x="24" y="325" width="432" height="187" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="358" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">The evidence is missing</text><text x="44" y="428" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Improve context</text><text x="44" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Supply current, permitted sources.</text><rect x="24" y="535" width="432" height="187" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="568" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">It cannot check or act</text><text x="44" y="638" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Add tools and a bounded loop</text><text x="44" y="680" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Retrieve, inspect, and verify</text><text x="44" y="707" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">results.</text><rect x="24" y="745" width="432" height="187" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="778" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">Behavior still fails with good</text><text x="44" y="808" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">inputs</text><text x="44" y="848" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Evaluate model adaptation</text><text x="44" y="890" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Compare examples, models, or</text><text x="44" y="917" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">training.</text><rect x="24" y="955" width="432" height="187" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="988" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">A working solution costs too</text><text x="44" y="1018" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263f43">much</text><text x="44" y="1058" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#276f70">Evaluate distillation</text><text x="44" y="1100" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#263f43">Retest quality on a smaller model.</text></svg>