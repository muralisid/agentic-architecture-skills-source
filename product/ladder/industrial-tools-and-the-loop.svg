<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">Investigate a vegetation candidate</title><desc id="desc">Candidate: Image near an asset. Tool call: Check map and work orders. Observation: Read evidence and gaps. Next step: Inspect, request, or stop. Proposed industrial example. Evaluate against the simpler existing process before adopting it.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Investigate a vegetation candidate</text><rect x="28.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Candidate</text><text x="44.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Image near an asset</text><path d="M274.0 219 H289.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="294.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="310.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="310.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Tool call</text><text x="310.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Check map and work</text><text x="310.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">orders</text><path d="M540.0 219 H555.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="576.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="576.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Observation</text><text x="576.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Read evidence and</text><text x="576.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">gaps</text><path d="M806.0 219 H821.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="826.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="842.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="842.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Next step</text><text x="842.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Inspect, request, or</text><text x="842.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">stop</text><text x="28" y="415" font-family="Arial,sans-serif" font-size="15" fill="#465958">Proposed industrial example. Evaluate against the simpler existing process before adopting it.</text></svg>