<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">Match the failure to the intervention</title><desc id="desc">Unclear tasks suggest instructions; missing evidence suggests context; missing capabilities suggest tools; residual behavior failures may justify adaptation; expensive demonstrated capability may justify distillation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263f43">What is stopping this task?</text><rect x="24" y="115" width="952" height="142" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="157" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">The task is unclear</text><path d="M451 184 L494 184" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="159" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Clarify instructions</text><text x="520" y="199" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Keep the goal and output testable.</text><rect x="24" y="280" width="952" height="142" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="322" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">The evidence is missing</text><path d="M451 349 L494 349" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="324" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Improve context</text><text x="520" y="364" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Supply current, permitted sources.</text><rect x="24" y="445" width="952" height="142" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="487" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">It cannot check or act</text><path d="M451 514 L494 514" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="489" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Add tools and a bounded loop</text><text x="520" y="529" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Retrieve, inspect, and verify</text><text x="520" y="558" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">results.</text><rect x="24" y="610" width="952" height="142" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="652" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">Behavior still fails with</text><text x="44" y="684" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">good inputs</text><path d="M451 679 L494 679" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="654" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Evaluate model adaptation</text><text x="520" y="694" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Compare examples, models, or</text><text x="520" y="723" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">training.</text><rect x="24" y="775" width="952" height="142" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="817" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">A working solution costs too</text><text x="44" y="849" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263f43">much</text><path d="M451 844 L494 844" fill="none" stroke="#9f452e" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="819" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276f70">Evaluate distillation</text><text x="520" y="859" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">Retest quality on a smaller model.</text></svg>