<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">Choose how the work is coordinated</title><desc id="desc">Known steps: Use a fixed workflow. Uncertain next step: Use one bounded agent. Distinct specialties: Consider separate agents. Shared result: Check handoffs and evidence. These are alternatives to compare. Several models can operate inside a single agent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Choose how the work is coordinated</text><rect x="28.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Known steps</text><text x="44.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use a fixed workflow</text><path d="M274.0 219 H289.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="294.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="310.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="310.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Uncertain next</text><text x="310.0" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">step</text><text x="310.0" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use one bounded agent</text><path d="M540.0 219 H555.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="560.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="576.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="576.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Distinct</text><text x="576.0" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">specialties</text><text x="576.0" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Consider separate</text><text x="576.0" y="250" font-family="Arial,sans-serif" font-size="16" fill="#465958">agents</text><path d="M806.0 219 H821.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="826.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="842.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="842.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Shared result</text><text x="842.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Check handoffs and</text><text x="842.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">evidence</text><text x="28" y="415" font-family="Arial,sans-serif" font-size="15" fill="#465958">These are alternatives to compare. Several models can operate inside a single agent.</text></svg>