<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">Teach a consistent inspection report</title><desc id="desc">Examples: Reviewed evidence and reports. Training: Learn the report behavior. Evaluation: Hold out sites and cases. Runtime: Retrieve current facts. Proposed industrial example. Evaluate against the simpler existing process before adopting it.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Teach a consistent inspection report</text><rect x="28.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Examples</text><text x="44.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Reviewed evidence and</text><text x="44.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">reports</text><path d="M274.0 219 H289.0" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="294.0" y="126" width="244.0" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="310.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="310.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Training</text><text x="310.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Learn the report</text><text x="310.0" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">behavior</text><path d="M540.0 219 H555.0" fill="none" stroke="#9a4c2d" stroke-width="2" mark