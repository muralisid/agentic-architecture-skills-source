<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 807" role="img" aria-labelledby="title desc"><title id="title">Check whether the feedback measures the job</title><desc id="desc">Task: Prepare supported findings. Feedback: Check evidence and omissions. Challenge: Try to exploit the score. Evaluation: Use independent review. Proposed industrial example. Evaluate against the simpler existing process before adopting it.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Check whether the feedback</text><text x="28" y="69" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">measures the job</text><rect x="28" y="100" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="126" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Task</text><text x="44" y="179" font-family="Arial,sans-serif" font-size="16" fill="#465958">Prepare supported findings</text><path d="M240 230 V250" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="258" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="44" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Feedback</text><text x="44" y="337" font-family="Arial,sans-serif" font-size="16" fill="#465958">Check evidence and omissions</text><path d="M240 388 V408" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="416" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="442" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="44" y="466" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Challenge</text><text x="44" y="495" font-family="Arial,sans-serif" font-size="16" fill="#465958">Try to exploit the score</text><path d="M240 546 V566" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="574" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="44" y="624" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Evaluation</text><text x="44" y="653" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use independent review</text><text x="28" y="762" font-family="Arial,sans-serif" font-size="15" fill="#465958">Proposed industrial example. Evaluate against</text><text x="28" y="782" font-family="Arial,sans-serif" font-size="15" fill="#465958">the simpler existing process before adopting it.</text></svg>