<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">Choose the change that fits the problem</title><desc id="desc">Observe a failure: Use a real task. Locate the cause: Information, tool, model. Try a small change: Keep a matched baseline. Measure the result: Quality, time, cost. Release or revise: Keep the ability to undo. More training is one option. A better tool or clearer evidence may solve the same problem.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Choose the change that fits the problem</text><rect x="28.0" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Observe a</text><text x="44.0" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">failure</text><text x="44.0" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Use a real task</text><path d="M220.8 219 H235.8" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="240.8" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="256.8" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="256.8" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Locate the cause</text><text x="256.8" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Information, tool,</text><text x="256.8" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">model</text><path d="M433.6 219 H448.6" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="453.6" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="469.6" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="469.6" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Try a small</text><text x="469.6" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">change</text><text x="469.6" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Keep a matched</text><text x="469.6" y="250" font-family="Arial,sans-serif" font-size="16" fill="#465958">baseline</text><path d="M646.4000000000001 219 H661.4000000000001" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="666.4000000000001" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="682.4000000000001" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="682.4000000000001" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Measure the</text><text x="682.4000000000001" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">result</text><text x="682.4000000000001" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Quality, time, cost</text><path d="M859.2 219 H874.2" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="879.2" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="895.2" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">05</text><text x="895.2" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Release or</text><text x="895.2" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">revise</text><text x="895.2" y="229" font-family="Arial,sans-serif" font-size="16" fill="#465958">Keep the ability to</text><text x="895.2" y="250" font-family="Arial,sans-serif" font-size="16" fill="#465958">undo</text><text x="28" y="415" font-family="Arial,sans-serif" font-size="15" fill="#465958">More training is one option. A better tool or clearer evidence may solve the same problem.</text></svg>