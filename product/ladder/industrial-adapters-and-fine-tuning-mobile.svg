<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 807" role="img" aria-labelledby="title desc"><title id="title">Teach a consistent inspection report</title><desc id="desc">Examples: Reviewed evidence and reports. Training: Learn the report behavior. Evaluation: Hold out sites and cases. Runtime: Retrieve current facts. Proposed industrial example. Evaluate against the simpler existing process before adopting it.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">Teach a consistent inspection</text><text x="28" y="69" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">report</text><rect x="28" y="100" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="126" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44" y="150" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Examples</text><text x="44" y="179" font-family="Arial,sans-serif" font-size="16" fill="#465958">Reviewed evidence and reports</text><path d="M240 230 V250" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="258" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="284" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="44" y="308" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Training</text><text x="44" y="337" font-family="Arial,sans-serif" font-size="16" fill="#465958">Learn the report behavior</text><path d="M240 388 V408" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="416" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="442" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="44" y="466" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Evaluation</text><text x="44" y="495" font-family="Arial,sans-serif" font-size="16" fill="#465958">Hold out sites and cases</text><path d="M240 546 V566" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="574" width="424" height="130" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="44" y="624" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Runtime</text><text x="44" y="653" font-family="Arial,sans-serif" font-size="16" fill="#465958">Retrieve current facts</text><text x="28" y="762" font-family="Arial,sans-serif" font-size="15" fill="#465958">Proposed industrial example. Evaluate against</text><text x="28" y="782" font-family="Arial,sans-serif" font-size="15" fill="#465958">the simpler existing process before adopting it.</text></svg>