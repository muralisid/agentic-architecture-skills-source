<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Why a better answer may not finish the job</title><desc id="desc">A model answering a question: “Inspect the pump bearing.”: A useful suggestion, but no asset lookup, current reading, or work receipt.: Advice has been produced.; An agent doing bounded work: A reviewed inspection request: Use the right records, gather missing evidence, request approval, verify receipt.: An outcome can be confirmed.. First identify what the task is missing. Then choose the change that supplies it.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9f452e"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="43" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#263f43">Why a better answer may not finish the job</text><rect x="24" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="44" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#9f452e">A model answering a question</text><text x="44" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263f43">“Inspect the pump bearing.”</text><text x="44" y="282" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">A useful suggestion, but no asset</text><text x="44" y="311" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">lookup, current reading, or work</text><text x="44" y="340" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#263f43">receipt.</text><text x="44" y="375" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#263f43">Advice has been produced.</text><rect x="518" y="125" width="458" height="320" rx="16" fill="#fff" stroke="#ced8d5"/><text x="538" y="159" font-family="Arial,sans-serif" font-size="19" font-weight="