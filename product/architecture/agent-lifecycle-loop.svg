<path d="M1230 474 L1248 474" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<rect x="1024" y="498" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
<text x="1040" y="520" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Autonomy level</text>
<path d="M1230 514 L1248 514" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<rect x="1024" y="538" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
<text x="1040" y="560" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Sponsor</text>
<path d="M1230 554 L1248 554" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<path d="M478 212 L478 222" fill="none" stroke="#d97706" stroke-width="2"/>
