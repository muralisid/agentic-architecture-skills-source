<rect x="1024" y="258" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
<text x="1040" y="280" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Model</text>
