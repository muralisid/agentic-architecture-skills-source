<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">The agent lifecycle: register to retire</title>
<desc id="desc">Every agent passes through nine stages, from register to retire. Eight kinds of change send a running agent back to evaluation. The sponsor checks purpose, access, budget and need every quarter, or every year for Tier 1. Retiring has five steps: disable, revoke, redirect, remove and keep. Each stage carries a badge: shipped in a product, set out in guidance, or no standard yet. When a sponsor leaves, a successor must be named. One registry record holds it all, in four groups.</desc>
<defs>
<marker id="ah-brown" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker>
<marker id="ah-control" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker>
<marker id="ah-human" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#d97706"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">The agent lifecycle: register to retire</text>
<text x="40" y="84" font-family="Arial,sans-serif" font-size="20" fill="#465958">No agent runs without a registry entry and a named sponsor.</text>
<rect x="40" y="104" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="52" y="134" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">1. Register</text>
<text x="52" y="160" font-family="Arial,sans-serif" font-size="18" fill="#465958">Entry and its own identity</text>
<rect x="52" y="174" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="98.6" y="194.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
<rect x="340" y="104" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="352" y="134" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">2. Sponsor and owner</text>
<text x="352" y="160" font-family="Arial,sans-serif" font-size="18" fill="#465958">Named at creation</text>
<rect x="352" y="174" width="83.3" height="28" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="393.6" y="194.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#134e4a">Shipped</text>
<rect x="640" y="104" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="652" y="134" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">3. Entitle</text>
<text x="652" y="160" font-family="Arial,sans-serif" font-size="18" fill="#465958">Template, expiring grant</text>
<rect x="652" y="174" width="162.5" height="28" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="733.2" y="194.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#134e4a">Shipped in part</text>
<rect x="940" y="104" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="952" y="134" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">4. Evaluate</text>
<text x="952" y="160" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tests and red-team attacks</text>
<rect x="952" y="174" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="998.6" y="194.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
<rect x="1276" y="104" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="1288" y="134" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">5. Approve</text>
<text x="1288" y="160" font-family="Arial,sans-serif" font-size="18" fill="#465958">Path set by risk tier</text>
<rect x="1288" y="174" width="162.5" height="28" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="1369.2" y="194.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#134e4a">Shipped in part</text>
<rect x="1276" y="606" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="1288" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">6. Operate</text>
<text x="1288" y="662" font-family="Arial,sans-serif" font-size="18" fill="#465958">Budget, caps, kill switch</text>
<rect x="1288" y="676" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1334.6" y="696.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
<rect x="940" y="606" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="952" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">7. Change</text>
<text x="952" y="662" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tests and risk re-run</text>
<rect x="952" y="676" width="160" height="28" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1032" y="696.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e293b">No standard yet</text>
<rect x="640" y="606" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="652" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">8. Periodic review</text>
<text x="652" y="662" font-family="Arial,sans-serif" font-size="18" fill="#465958">Sponsor confirms need</text>
<rect x="652" y="676" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="698.6" y="696.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
<rect x="340" y="606" width="280" height="108" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="352" y="636" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">9. Retire</text>
<text x="352" y="662" font-family="Arial,sans-serif" font-size="18" fill="#465958">Not just switched off</text>
<rect x="352" y="676" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="398.6" y="696.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
