<text x="354" y="246" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#78350f">Sponsor leaves</text>
<path d="M502 240 L540 240" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ah-human)"/>
<text x="552" y="246" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#78350f">name a successor</text>
<rect x="348" y="268" width="656" height="328" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="364" y="298" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#134e4a">The registry record</text>
<text x="988" y="298" font-family="Arial,sans-serif" font-size="18" text-anchor="end" fill="#134e4a">one per agent</text>
<rect x="364" y="314" width="305" height="130" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="376" y="340" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">Who it is and why it exists</text>
<text x="376" y="364" font-family="Arial,sans-serif" font-size="18" fill="#465958">ID, template and purpose</text>
<text x="376" y="387" font-family="Arial,sans-serif" font-size="18" fill="#465958">Role and business area</text>
<text x="376" y="410" font-family="Arial,sans-serif" font-size="18" fill="#465958">Sponsor and owner</text>
<text x="376" y="433" font-family="Arial,sans-serif" font-size="18" fill="#465958">Lifecycle state</text>
<rect x="683" y="314" width="305" height="130" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="695" y="340" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">What it can do</text>
<text x="695" y="364" font-family="Arial,sans-serif" font-size="18" fill="#465958">Permissions and scopes</text>
<text x="695" y="387" font-family="Arial,sans-serif" font-size="18" fill="#465958">Untrusted input</text>
<text x="695" y="410" font-family="Arial,sans-serif" font-size="18" fill="#465958">Highest data class, egress</text>
<text x="695" y="433" font-family="Arial,sans-serif" font-size="18" fill="#465958">Zones and rules that apply</text>
<rect x="364" y="456" width="305" height="130" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="376" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">How it is governed</text>
<text x="376" y="506" font-family="Arial,sans-serif" font-size="18" fill="#465958">Risk tier and its factor</text>
<text x="376" y="529" font-family="Arial,sans-serif" font-size="18" fill="#465958">Autonomy, learning, budget</text>
<text x="376" y="552" font-family="Arial,sans-serif" font-size="18" fill="#465958">Evaluations, approvals</text>
<text x="376" y="575" font-family="Arial,sans-serif" font-size="18" fill="#465958">Regulatory tags</text>
<rect x="683" y="456" width="305" height="130" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="695" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">How it changes over time</text>
<text x="695" y="506" font-family="Arial,sans-serif" font-size="18" fill="#465958">Model, prompt, tool versions</text>
<text x="695" y="529" font-family="Arial,sans-serif" font-size="18" fill="#465958">Memory policy, change log</text>
<text x="695" y="552" font-family="Arial,sans-serif" font-size="18" fill="#465958">Last review, last run</text>
<text x="695" y="575" font-family="Arial,sans-serif" font-size="18" fill="#465958">Revoke time</text>
<text x="40" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#182e31">Retire, step by step</text>
<rect x="40" y="260" width="280" height="66" rx="12" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="288" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. Disable</text>
<text x="52" y="312" font-family="Arial,sans-serif" font-size="18" fill="#465958">Stop work, block tokens</text>
<rect x="40" y="336" width="280" height="66" rx="12" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="364" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">2. Revoke</text>
<text x="52" y="388" font-family="Arial,sans-serif" font-size="18" fill="#465958">Credentials, grants, keys</text>
<rect x="40" y="412" width="280" height="66" rx="12" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="440" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">3. Redirect</text>
<text x="52" y="464" font-family="Arial,sans-serif" font-size="18" fill="#465958">To replacement or person</text>
<rect x="40" y="488" width="280" height="66" rx="12" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="516" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">4. Remove</text>
<text x="52" y="540" font-family="Arial,sans-serif" font-size="18" fill="#465958">Memory and unique tools</text>
<rect x="40" y="564" width="280" height="66" rx="12" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="52" y="592" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">5. Keep</text>
<text x="52" y="616" font-family="Arial,sans-serif" font-size="18" fill="#465958">Decision records, traces</text>
<path d="M340 696 L328 696 L328 293 L318 293" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah-control)"/>
<path d="M780 714 L780 760 L1414 760 L1414 716" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah-control)"/>
<text x="794" y="790" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Purpose, access, budget, need: quarterly; yearly for Tier 1</text>
<text x="794" y="830" font-family="Arial,sans-serif" font-size="18" fill="#9a4c2d">Any change trigger re-runs the evaluations and the risk profile before release.</text>
<text x="40" y="680" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#182e31">Where each stage stands</text>
<rect x="40" y="694" width="83.3" height="28" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="81.7" y="714.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#134e4a">Shipped</text>
<text x="214" y="714" font-family="Arial,sans-serif" font-size="18" fill="#465958">in a product</text>
<rect x="40" y="736" width="93.2" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="86.6" y="756.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">Guidance</text>
<text x="214" y="756" font-family="Arial,sans-serif" font-size="18" fill="#465958">in guidance</text>
<rect x="40" y="778" width="160" height="28" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="120" y="798.5" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e293b">No standard yet</text>
<text x="214" y="798" font-family="Arial,sans-serif" font-size="18" fill="#465958">practitioners only</text>
</svg>
