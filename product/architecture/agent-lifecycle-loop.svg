<path d="M1230 314 L1248 314" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<rect x="1024" y="338" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
<text x="1040" y="360" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Tools</text>
<path d="M1230 354 L1248 354" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<rect x="1024" y="378" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
<text x="1040" y="400" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Permissions</text>
<path d="M1230 394 L1248 394" fill="none" stroke="#9a4c2d" stroke-width="2"/>
<rect x="1024" y="418" width="206" height="32" rx="16" fill="#fff" stroke="#9a4c2d" stroke-width="1.5"/>
