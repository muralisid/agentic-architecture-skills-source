<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">One inspection task, end to end</title><desc id="desc">Request: Inspect this asset. Evidence: Read records and images. Investigation: Check what is missing. Allowed action: Create an inspection. Confirmation: Record the result. Permission is checked before an action; evidence and human responsibility span the task.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9a4c2d"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ef"/><text x="28" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="600" fill="#182e31">One inspection task, end to end</text><rect x="28.0" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="44.0" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">01</text><text x="44.0" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Request</text><text x="44.0" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Inspect this asset</text><path d="M220.8 219 H235.8" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="240.8" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="256.8" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">02</text><text x="256.8" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Evidence</text><text x="256.8" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Read records and</text><text x="256.8" y="226" font-family="Arial,sans-serif" font-size="16" fill="#465958">images</text><path d="M433.6 219 H448.6" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="453.6" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="469.6" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">03</text><text x="469.6" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Investigation</text><text x="469.6" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Check what is missing</text><path d="M646.4000000000001 219 H661.4000000000001" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="666.4000000000001" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="682.4000000000001" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">04</text><text x="682.4000000000001" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Allowed action</text><text x="682.4000000000001" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Create an inspection</text><path d="M859.2 219 H874.2" fill="none" stroke="#9a4c2d" stroke-width="2" marker-end="url(#arrow)"/><rect x="879.2" y="126" width="190.8" height="195" rx="12" fill="#fff" stroke="#d5d9d4"/><text x="895.2" y="152" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9a4c2d">05</text><text x="895.2" y="176" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#182e31">Confirmation</text><text x="895.2" y="205" font-family="Arial,sans-serif" font-size="16" fill="#465958">Record the result</text><text x="28" y="415" font-family="Arial,sans-serif" font-size="15" fill="#465958">Permission is checked before an action; evidence and human responsibility span the task.</text></svg>