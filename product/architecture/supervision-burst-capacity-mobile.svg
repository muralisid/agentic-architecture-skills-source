<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2162" role="img" aria-labelledby="title desc">
<title id="title">Supervision capacity at burst</title>
<desc id="desc">Span of control, how many agents one person can supervise, equals neglect time divided by the sum of interaction time and wait time, plus one. Leaving wait time out overstates capacity by up to 67 percent. A timeline shows routine exceptions, then a burst that crosses the capacity line in the busiest ten minutes while the daily average still looks fine. The system degrades safely, then recovers.</desc>
<defs>
<marker id="ah182e31" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#182e31"/></marker>
</defs>
<rect x="0" y="0" width="720" height="2162" fill="#f8f5ef"/>
<text x="28" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#182e31">Supervision capacity at burst</text>
<text x="28" y="113" font-family="Arial,sans-serif" font-size="24" fill="#465958">Size oversight for the busiest ten minutes, with</text>
<text x="28" y="144" font-family="Arial,sans-serif" font-size="24" fill="#465958">wait time counted. Never use a daily average.</text>
<rect x="28" y="189" width="664" height="150" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="52" y="239" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#182e31">Span of control =</text>
<text x="52" y="279" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#182e31">neglect time /</text>
<text x="52" y="319" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#182e31">(interaction time + <tspan fill="#e11d48">wait time</tspan>) + 1</text>
<rect x="28" y="357" width="664" height="148" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="48" y="402.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#182e31">Span of control</text>
<text x="48" y="444.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">How many agents one person can supervise.</text>
<rect x="28" y="519" width="664" height="117" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="48" y="564.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#182e31">Neglect time</text>
<text x="48" y="606.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">How long an agent can safely run unattended.</text>
<rect x="28" y="650" width="664" height="117" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="48" y="695.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#182e31">Interaction time</text>
<text x="48" y="737.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">How long a person needs per intervention.</text>
<rect x="28" y="781" width="664" height="148" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="48" y="826.2" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#881337">Wait time</text>
<text x="48" y="868.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">The term people drop. Leaving it out overstates</text>
<text x="48" y="899.6" font-family="Arial,sans-serif" font-size="24" fill="#465958">capacity by up to 67 percent.</text>
<text x="28" y="973" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#182e31">Items needing a person, per ten minutes</text>
