<circle cx="45" cy="1503" r="17" fill="#182e31"/>
<text x="45" y="1512" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="76" y="1511" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#182e31">Routine</text>
<text x="76" y="1543" font-family="Arial,sans-serif" font-size="24" fill="#465958">Exceptions arrive within staffed capacity.</text>
<circle cx="45" cy="1580" r="17" fill="#182e31"/>
<text x="45" y="1589" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="76" y="1588" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#182e31">Burst</text>
<text x="76" y="1620" font-family="Arial,sans-serif" font-size="24" fill="#465958">Exceptions arrive together and exceed</text>
<text x="76" y="1651" font-family="Arial,sans-serif" font-size="24" fill="#465958">capacity.</text>
<circle cx="45" cy="1688" r="17" fill="#182e31"/>
<text x="45" y="1697" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="76" y="1696" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#182e31">Degrade</text>
<text x="76" y="1728" font-family="Arial,sans-serif" font-size="24" fill="#465958">Pause, narrow permissions or return work to</text>
<text x="76" y="1759" font-family="Arial,sans-serif" font-size="24" fill="#465958">people.</text>
<circle cx="45" cy="1796" r="17" fill="#182e31"/>
<text x="45" y="1805" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="76" y="1804" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#182e31">Recover</text>
<text x="76" y="1836" font-family="Arial,sans-serif" font-size="24" fill="#465958">Clear the backlog and verify before restoring</text>
<text x="76" y="1867" font-family="Arial,sans-serif" font-size="24" fill="#465958">autonomy.</text>
<text x="28" y="1918" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">Capacity: what reviewers can clear in ten minutes,</text>
<text x="28" y="1949" font-family="Arial,sans-serif" font-size="24" fill="#0f172a">wait time counted.</text>
<text x="28" y="1986" font-family="Arial,sans-serif" font-size="24" fill="#465958">Daily average: looks fine on the dashboard.</text>
<text x="28" y="2023" font-family="Arial,sans-serif" font-size="24" fill="#881337">Over capacity: the queue and wait times grow.</text>
<text x="28" y="2090" font-family="Arial,sans-serif" font-size="24" fill="#465958">No credible human-to-agent supervision ratio is</text>
<text x="28" y="2121" font-family="Arial,sans-serif" font-size="24" fill="#465958">published. Use your own measured wait times.</text>
