<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Seven planes across fourteen layers</title>
<desc id="desc">A fourteen-floor building shows the layers you already own, from R01 Infrastructure at the bottom to R14 Agent data engineering at the top. Seven vertical planes cross it: execution, action, knowledge, control, improvement, evidence and human, with a mark where each plane is mainly built from a layer. Two rules bind them: enforcement lives outside execution, so the control plane stops actions at the edge of the execution plane, and evidence is collected where the agent cannot write. A dashed second outline shows the licensed estate, where agents run on a vendor control plane that your own gateway does not see.</desc>
