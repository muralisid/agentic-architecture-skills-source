<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">From company data to a cited answer</title>
<desc id="desc">Company data reaches a cited answer in nine stages, in three groups. Get the data ready: parse with provenance, chunk and add context, embed with versions, index with permissions. Answer from it: retrieve or refuse, cite every passage. Afterwards: write memory through quarantine, refresh on source change, erase in cascade. Every copy keeps the original's access rules, privacy duties, location limits and deletion duty. Working memory serves one step, thread memory one case, and long-term memory later tasks, where it becomes a record.</desc>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">From company data to a cited answer</text>
<text x="40" y="88" font-family="Arial,sans-serif" font-size="20" fill="#465958">Nine stages. Every copy keeps the original's access, privacy and deletion duties.</text>
<text x="40" y="130" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">Get the data ready</text>
<text x="1068" y="130" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">Answer from it</text>
<rect x="40" y="145" width="235" height="215" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="70" cy="177" r="16" fill="#2563eb"/>
<text x="70" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="96" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Parse</text>
<text x="56" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">with provenance</text>
<text x="56" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Keep the source</text>
<text x="56" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">page and cell of</text>
<text x="56" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">every piece.</text>
<path d="M275 252.5 L295 252.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="297" y="145" width="235" height="215" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="327" cy="177" r="16" fill="#2563eb"/>
<text x="327" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="353" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Chunk</text>
<text x="313" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">and add context</text>
<text x="313" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Split into small</text>
<text x="313" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">pieces. Test each</text>
<text x="313" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">source.</text>
<path d="M532 252.5 L552 252.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="554" y="145" width="235" height="215" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="584" cy="177" r="16" fill="#2563eb"/>
<text x="584" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="610" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Embed</text>
<text x="570" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">with versions</text>
<text x="570" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Each embedding</text>
<text x="570" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">records its model</text>
<text x="570" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">version.</text>
<path d="M789 252.5 L809 252.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="811" y="145" width="235" height="215" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<circle cx="841" cy="177" r="16" fill="#2563eb"/>
<text x="841" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="867" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Index</text>
<text x="827" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">with permissions</text>
<text x="827" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Access lists go</text>
<text x="827" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">into the index.</text>
<text x="827" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">Filter before</text>
<text x="827" y="318" font-family="Arial,sans-serif" font-size="18" fill="#465958">searching.</text>
<path d="M1046 252.5 L1066 252.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1068" y="145" width="235" height="215" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="1098" cy="177" r="16" fill="#7c3aed"/>
<text x="1098" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="1124" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4c1d95">Retrieve</text>
<text x="1084" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4c1d95">or refuse</text>
<text x="1084" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Key numbers come</text>
<text x="1084" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">from a fixed</text>
<text x="1084" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">calculation, or the</text>
<text x="1084" y="318" font-family="Arial,sans-serif" font-size="18" fill="#465958">agent refuses.</text>
<path d="M1303 252.5 L1323 252.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1325" y="145" width="235" height="215" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="1355" cy="177" r="16" fill="#7c3aed"/>
<text x="1355" y="183.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="1381" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4c1d95">Cite</text>
<text x="1341" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#4c1d95">every passage</text>
<text x="1341" y="249" font-family="Arial,sans-serif" font-size="18" fill="#465958">Each answer links</text>
<text x="1341" y="272" font-family="Arial,sans-serif" font-size="18" fill="#465958">to the exact text</text>
<text x="1341" y="295" font-family="Arial,sans-serif" font-size="18" fill="#465958">it used.</text>
<path d="M1442.5 360 L1442.5 392 L157.5 392 L157.5 423" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="175.5" y="416" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">Afterwards</text>
<rect x="40" y="425" width="235" height="215" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<circle cx="70" cy="457" r="16" fill="#0f766e"/>
<text x="70" y="463.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<text x="96" y="465" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#134e4a">Write memory</text>
<text x="56" y="497" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">through quarantine</text>
<text x="56" y="529" font-family="Arial,sans-serif" font-size="18" fill="#465958">New memories wait</text>
<text x="56" y="552" font-family="Arial,sans-serif" font-size="18" fill="#465958">until they are</text>
<text x="56" y="575" font-family="Arial,sans-serif" font-size="18" fill="#465958">promoted.</text>
<path d="M275 532.5 L295 532.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="297" y="425" width="235" height="215" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<circle cx="327" cy="457" r="16" fill="#0f766e"/>
<text x="327" y="463.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<text x="353" y="465" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#134e4a">Refresh</text>
<text x="313" y="497" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">on source change</text>
<text x="313" y="529" font-family="Arial,sans-serif" font-size="18" fill="#465958">Change data</text>
<text x="313" y="552" font-family="Arial,sans-serif" font-size="18" fill="#465958">capture keeps the</text>
<text x="313" y="575" font-family="Arial,sans-serif" font-size="18" fill="#465958">index fresh.</text>
<path d="M532 532.5 L552 532.5" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="554" y="425" width="235" height="215" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<circle cx="584" cy="457" r="16" fill="#0f766e"/>
<text x="584" y="463.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">9</text>
<text x="610" y="465" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#134e4a">Erase</text>
<text x="570" y="497" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#134e4a">in cascade</text>
<text x="570" y="529" font-family="Arial,sans-serif" font-size="18" fill="#465958">A delete reaches</text>
<text x="570" y="552" font-family="Arial,sans-serif" font-size="18" fill="#465958">every copy and</text>
<text x="570" y="575" font-family="Arial,sans-serif" font-size="18" fill="#465958">every memory.</text>
<rect x="830" y="425" width="730" height="215" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
<text x="850" y="463" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">The rule behind all nine</text>
<text x="850" y="497" font-family="Arial,sans-serif" font-size="18" fill="#465958">Every copy keeps the original's access rules, privacy duties,</text>
<text x="850" y="521" font-family="Arial,sans-serif" font-size="18" fill="#465958">location limits and deletion duty.</text>
<text x="850" y="545" font-family="Arial,sans-serif" font-size="18" fill="#465958">Embeddings count as data: short texts can be rebuilt from them.</text>
<text x="850" y="569" font-family="Arial,sans-serif" font-size="18" fill="#465958">A copy built from several sources takes the strictest label.</text>
<text x="850" y="593" font-family="Arial,sans-serif" font-size="18" fill="#465958">Open gap: a summary of many documents has no complete</text>
<text x="850" y="617" font-family="Arial,sans-serif" font-size="18" fill="#465958">permissions answer yet.</text>
<text x="40" y="690" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">What the agent keeps</text>
<rect x="40" y="705" width="493" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="741" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e293b">Working memory</text>
<text x="58" y="777" font-family="Arial,sans-serif" font-size="18" fill="#465958">What is in front of the model for this step.</text>
<text x="58" y="801" font-family="Arial,sans-serif" font-size="18" fill="#465958">Engineering, not a record.</text>
<rect x="553" y="705" width="493" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="571" y="741" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e293b">Thread memory</text>
<text x="571" y="777" font-family="Arial,sans-serif" font-size="18" fill="#465958">One case or conversation, kept across a pause.</text>
<text x="571" y="801" font-family="Arial,sans-serif" font-size="18" fill="#465958">It resumes where it stopped.</text>
<rect x="1066" y="705" width="493" height="150" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1084" y="741" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#881337">Long-term memory</text>
<text x="1084" y="777" font-family="Arial,sans-serif" font-size="18" fill="#465958">Kept for later tasks. A record: ownership,</text>
<text x="1084" y="801" font-family="Arial,sans-serif" font-size="18" fill="#465958">consent, retention and deletion apply.</text>
</svg>
