<text x="42" y="860" font-family="Arial,sans-serif" font-size="24" font-style="italic" fill="#465958">Approves</text>
<text x="42" y="890" font-family="Arial,sans-serif" font-size="24" font-style="italic" fill="#465958">irreversible actions</text>
