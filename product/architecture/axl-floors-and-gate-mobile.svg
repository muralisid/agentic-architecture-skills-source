<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1890" role="img" aria-labelledby="title desc">
<title id="title">The autonomy and learning scales: lowest tier, ceiling and gate</title>
<desc id="desc">Six autonomy levels run across, from manual (A0) to governed lights-out (A5). Four learning levels run down, from fixed (L0) to continuous learning inside limits (L3). Assisted (A1) and delegated tasks (A2) need at least Tier 1. Supervised autonomy (A3) needs at least Tier 2. Managed autonomy (A4) and governed lights-out (A5) need Tier 3. A4 and above need reviewed learning (L2) and proven supervision capacity at peak load. The readiness ceiling sits at the weakest area. Exercised autonomy above permitted is an incident, and controls follow the higher of the two.</desc>
<defs>
<marker id="ah-risk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e11d48"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fde8ec"/><path d="M0 0 V14" stroke="#e11d48" stroke-width="3" stroke-opacity="0.55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="28" y="64" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">The autonomy and learning</text>
<text x="28" y="104" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">scales: lowest tier, ceiling, gate</text>
<text x="28" y="152" font-family="Arial,sans-serif" font-size="24" fill="#465958">Each piece of work gets an autonomy level</text>
<text x="28" y="184" font-family="Arial,sans-serif" font-size="24" fill="#465958">and a learning level. Both can be reversed.</text>
<text x="28" y="224" font-family="Arial,sans-serif" font-size="24" fill="#465958">L0 fixed</text>
