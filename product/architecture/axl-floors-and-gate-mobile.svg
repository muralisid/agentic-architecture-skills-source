<text x="557.8" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#182e31">L2</text>
<rect x="604.5" y="292" width="85.5" height="48" rx="8" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="647.2" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#182e31">L3</text>
<rect x="28" y="292" width="302" height="48" rx="8" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="42" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182e31">Autonomy</text>
