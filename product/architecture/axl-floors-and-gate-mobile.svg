<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1856" role="img" aria-labelledby="title desc">
<title id="title">Autonomy and learning: floors, ceiling and gate</title>
<desc id="desc">Autonomy levels A0 to A5 run across, and learning levels L0 to L3 run down. A1 and A2 carry a Tier 1 floor, A3 Tier 2, and A4 and A5 Tier 3. A4 and above need L2 and proven oversight capacity at burst. Exercised autonomy above permitted autonomy is an incident.</desc>
<defs>
<marker id="ah-risk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e11d48"/></marker>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fde8ec"/><path d="M0 0 V14" stroke="#e11d48" stroke-width="3" stroke-opacity="0.55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="28" y="64" font-family="Arial,sans-serif" font-size="36" font-weight="600" fill="#182e31">Autonomy and learning:</text>
<text x="28" y="108" font-family="Arial,sans-serif" font-size="36" font-weight="600" fill="#182e31">floors, ceiling and gate</text>
<text x="28" y="152" font-family="Arial,sans-serif" font-size="24" fill="#465958">Each workload gets an autonomy level and a</text>
<text x="28" y="184" font-family="Arial,sans-serif" font-size="24" fill="#465958">learning level. Both are earned and reversible.</text>
<text x="28" y="224" font-family="Arial,sans-serif" font-size="24" fill="#465958">L0 fixed policy</text>
<text x="360" y="224" font-family="Arial,sans-serif" font-size="24" fill="#465958">L1 curated learning</text>
<text x="28" y="258" font-family="Arial,sans-serif" font-size="24" fill="#465958">L2 governed learning</text>
<text x="360" y="258" font-family="Arial,sans-serif" font-size="24" fill="#465958">L3 continuous learning</text>
