<rect x="515" y="762" width="85.5" height="142" rx="8" fill="#dde3ea" stroke="#c4ccd4" stroke-width="1"/>
<rect x="604.5" y="762" width="85.5" height="142" rx="8" fill="#dde3ea" stroke="#c4ccd4" stroke-width="1"/>
<text x="28" y="936" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Oversight gate: burst capacity proven</text>
