<text x="378.8" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#182e31">L0</text>
<rect x="425.5" y="292" width="85.5" height="48" rx="8" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="468.2" y="325" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#182e31">L1</text>
