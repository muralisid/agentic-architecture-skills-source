<text x="44" y="1662" font-family="Arial,sans-serif" font-size="24" fill="#465958">D designed, P permitted, E exercised</text>
<text x="44" y="1696" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">Exercised above permitted = incident</text>
<text x="28" y="1752" font-family="Arial,sans-serif" font-size="24" fill="#465958">Controls follow the higher of permitted and</text>
<text x="28" y="1784" font-family="Arial,sans-serif" font-size="24" fill="#465958">exercised. The ceiling line shows one example: it</text>
<text x="28" y="1816" font-family="Arial,sans-serif" font-size="24" fill="#465958">sits at the weakest readiness area.</text>
