<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2160" role="img" aria-labelledby="title desc">
<title id="title">What kind of agent is this? Four questions</title>
<desc id="desc">Four questions describe any agent: role, permissions, autonomy and impact. Permissions and impact set the risk tier: Tier 1 (basic), Tier 2 (enhanced) or Tier 3 (strict), where the worst factor wins. The tier sets the controls. Autonomy sets the person's job, readiness caps it, and it can raise the tier. The role is a label and sets no controls. Its business area can bring in the rule for decisions about people, which adds to the controls. Record all four answers in the registry entry and score them again on every change.</desc>
<defs>
<marker id="ah-agent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7c3aed"/></marker>
<marker id="ah-control" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker>
<marker id="ah-neutral" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94a3b8"/></marker>
<marker id="ah-risk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e11d48"/></marker>
<marker id="ah-system" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2563eb"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="28" y="60" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">What kind of agent is this?</text>
<text x="28" y="100" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">Four questions</text>
<text x="28" y="142" font-family="Arial,sans-serif" font-size="24" fill="#465958">A role is a label, not a permission.</text>

<rect x="28" y="170" width="664" height="296" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="210" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1e293b">1. Role</text>
<text x="44" y="244" font-family="Arial,sans-serif" font-size="24" fill="#1e293b">What it does for people</text>
<text x="44" y="282" font-family="Arial,sans-serif" font-size="24" fill="#465958">Converse, create, assist or coordinate</text>
<text x="44" y="320" font-family="Arial,sans-serif" font-size="24" fill="#465958">Plus a business area, such as billing</text>
<path d="M44 344 L676 344" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M44 372 L76 372" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#ah-neutral)"/>
<text x="92" y="380" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e293b">Label only. Sets no controls. Its</text>
<text x="92" y="412" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e293b">business area can bring in the rule</text>
<text x="92" y="444" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e293b">for decisions about people.</text>

<rect x="28" y="482" width="664" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="44" y="522" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">2. Permissions</text>
<text x="44" y="556" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">What its own credentials let it do</text>
<text x="44" y="594" font-family="Arial,sans-serif" font-size="24" fill="#465958">Read, write, delete, run code or SQL,</text>
<text x="44" y="626" font-family="Arial,sans-serif" font-size="24" fill="#465958">browse, send, pay, change access</text>
<text x="44" y="664" font-family="Arial,sans-serif" font-size="24" fill="#465958">Flags: untrusted input, data class,</text>
<text x="44" y="696" font-family="Arial,sans-serif" font-size="24" fill="#465958">memory writes</text>
<path d="M44 720 L676 720" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<path d="M44 748 L76 748" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<text x="92" y="756" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Sets the risk tier.</text>

<rect x="28" y="798" width="664" height="300" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="44" y="838" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#4c1d95">3. Autonomy</text>
<text x="44" y="872" font-family="Arial,sans-serif" font-size="24" fill="#4c1d95">How freely it acts</text>
<text x="44" y="910" font-family="Arial,sans-serif" font-size="24" fill="#465958">Manual (A0) to governed lights-out (A5)</text>
<text x="44" y="948" font-family="Arial,sans-serif" font-size="24" fill="#465958">Recorded as designed, permitted and</text>
<text x="44" y="980" font-family="Arial,sans-serif" font-size="24" fill="#465958">exercised</text>
<path d="M44 1004 L676 1004" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
<path d="M44 1032 L76 1032" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-agent)"/>
<text x="92" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">Sets the person's job. Readiness</text>
<text x="92" y="1072" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">caps it. It can raise the tier.</text>

<rect x="28" y="1114" width="664" height="262" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="44" y="1154" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#881337">4. Impact</text>
<text x="44" y="1188" font-family="Arial,sans-serif" font-size="24" fill="#881337">What it can damage</text>
<text x="44" y="1226" font-family="Arial,sans-serif" font-size="24" fill="#465958">Zones touched, deletion, decisions</text>
<text x="44" y="1258" font-family="Arial,sans-serif" font-size="24" fill="#465958">about people, whether it can be</text>
<text x="44" y="1290" font-family="Arial,sans-serif" font-size="24" fill="#465958">undone, how far it reaches</text>
<path d="M44 1314 L676 1314" fill="none" stroke="#e11d48" stroke-width="1.5"/>
<path d="M44 1342 L76 1342" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#ah-risk)"/>
<text x="92" y="1350" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">Sets the risk tier.</text>

<text x="28" y="1430" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182e31">Which answers set the controls</text>
<rect x="28" y="1452" width="316" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="44" y="1494" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Permissions</text>
<rect x="376" y="1452" width="316" height="64" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="392" y="1494" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">Impact</text>
<path d="M186 1516 L186 1562" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-system)"/>
<path d="M534 1516 L534 1540 L380 1540 L380 1562" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#ah-risk)"/>

<rect x="28" y="1566" width="412" height="190" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="44" y="1606" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Risk tier</text>
<text x="44" y="1640" font-family="Arial,sans-serif" font-size="24" fill="#465958">Tier 1 (basic),</text>
<text x="44" y="1672" font-family="Arial,sans-serif" font-size="24" fill="#465958">Tier 2 (enhanced) or</text>
<text x="44" y="1704" font-family="Arial,sans-serif" font-size="24" fill="#465958">Tier 3 (strict).</text>
<text x="44" y="1736" font-family="Arial,sans-serif" font-size="24" fill="#465958">The worst factor wins.</text>
<rect x="476" y="1600" width="216" height="120" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/>
<text x="492" y="1640" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">Autonomy</text>
<text x="492" y="1672" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">can raise</text>
<text x="492" y="1704" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4c1d95">the tier</text>
<path d="M476 1660 L444 1660" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah-agent)"/>

<path d="M234 1756 L234 1802" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#ah-control)"/>
<rect x="28" y="1806" width="412" height="160" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="44" y="1846" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Controls</text>
<text x="44" y="1880" font-family="Arial,sans-serif" font-size="24" fill="#465958">The tier sets the controls,</text>
<text x="44" y="1912" font-family="Arial,sans-serif" font-size="24" fill="#465958">who signs, and how often</text>
<text x="44" y="1944" font-family="Arial,sans-serif" font-size="24" fill="#465958">the agent is reviewed.</text>
<rect x="476" y="1826" width="216" height="120" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="492" y="1866" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">Rule for</text>
<text x="492" y="1898" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">decisions</text>
<text x="492" y="1930" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">about people</text>
<path d="M476 1886 L444 1886" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#ah-risk)"/>

<rect x="28" y="1996" width="664" height="130" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="44" y="2036" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#134e4a">Record all four answers in the</text>
<text x="44" y="2068" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#134e4a">agent's registry entry.</text>
<text x="44" y="2100" font-family="Arial,sans-serif" font-size="24" fill="#134e4a">Score them again on every change.</text>
</svg>
