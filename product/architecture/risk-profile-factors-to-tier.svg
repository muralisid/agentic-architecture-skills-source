<rect x="1180" y="104" width="390" height="197" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1196" y="138" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Tier 1 Basic</text>
<text x="1196" y="173" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Controls</text>
<text x="1304" y="173" font-family="Arial,sans-serif" font-size="18" fill="#465958">Own identity, scoped</text>
<text x="1304" y="196" font-family="Arial,sans-serif" font-size="18" fill="#465958">access, evals, a cap per</text>
<text x="1304" y="219" font-family="Arial,sans-serif" font-size="18" fill="#465958">run, a kill switch</text>
<text x="1196" y="250" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Who signs</text>
<text x="1304" y="250" font-family="Arial,sans-serif" font-size="18" fill="#465958">Owner and sponsor</text>
<text x="1196" y="281" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Review</text>
<text x="1304" y="281" font-family="Arial,sans-serif" font-size="18" fill="#465958">Yearly, and on change</text>
<rect x="1180" y="313" width="390" height="243" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1196" y="347" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Tier 2 Enhanced</text>
<text x="1196" y="382" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Controls</text>
<text x="1304" y="382" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tier 1, plus a policy</text>
<text x="1304" y="405" font-family="Arial,sans-serif" font-size="18" fill="#465958">check on every write and</text>
<text x="1304" y="428" font-family="Arial,sans-serif" font-size="18" fill="#465958">tested rollback</text>
<text x="1196" y="459" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Who signs</text>
<text x="1304" y="459" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tier 1, plus a security</text>
<text x="1304" y="482" font-family="Arial,sans-serif" font-size="18" fill="#465958">architect and the AI risk</text>
<text x="1304" y="505" font-family="Arial,sans-serif" font-size="18" fill="#465958">council</text>
<text x="1196" y="536" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Review</text>
<text x="1304" y="536" font-family="Arial,sans-serif" font-size="18" fill="#465958">Quarterly</text>
<rect x="1180" y="568" width="390" height="266" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1196" y="602" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Tier 3 Strict</text>
<text x="1196" y="637" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Controls</text>
<text x="1304" y="637" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tier 2, plus a policy</text>
<text x="1304" y="660" font-family="Arial,sans-serif" font-size="18" fill="#465958">check on every action and</text>
<text x="1304" y="683" font-family="Arial,sans-serif" font-size="18" fill="#465958">a named person for each</text>
<text x="1304" y="706" font-family="Arial,sans-serif" font-size="18" fill="#465958">floor action</text>
<text x="1196" y="737" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Who signs</text>
<text x="1304" y="737" font-family="Arial,sans-serif" font-size="18" fill="#465958">Tier 2, plus architecture</text>
<text x="1304" y="760" font-family="Arial,sans-serif" font-size="18" fill="#465958">review, second-line risk</text>
<text x="1304" y="783" font-family="Arial,sans-serif" font-size="18" fill="#465958">and an executive</text>
<text x="1196" y="814" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#475569">Review</text>
<text x="1304" y="814" font-family="Arial,sans-serif" font-size="18" fill="#465958">Quarterly, and continuous</text>
