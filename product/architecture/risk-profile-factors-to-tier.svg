<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Risk profile: factors to tier</title>
<desc id="desc">Nine factors are each scored Low, Medium or High. The worst factor sets Tier 1 Basic, Tier 2 Enhanced or Tier 3 Strict. Zone actions, production destruction, code on production, regulated data and decisions about people are always High. A fixed, reversible zone transaction in the signed register sits at Tier 2.</desc>
