<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2177" role="img" aria-labelledby="title desc">
<title id="title">The weakest area sets the ceiling</title>
<desc id="desc">Seven bars score Northstar, a fictional example, from 0 to 3. Data, integration, testing and people score 2, and identity, controls and cost score 1. A dashed line carries the lowest score, 1, to the ceiling table. There, data and integration at 2 or more, with all others at 1 or more, gives A2.</desc>
<defs>
<marker id="ah-risk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e11d48"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="28" y="64" font-family="Arial,sans-serif" font-size="36" font-weight="600" fill="#182e31">The weakest area sets the ceiling</text>
<text x="28" y="110" font-family="Arial,sans-serif" font-size="24" fill="#465958">Northstar Components, a fictional teaching</text>
<text x="28" y="142" font-family="Arial,sans-serif" font-size="24" fill="#465958">example. Profile 2, 2, 1, 1, 2, 1, 2. Ceiling A2.</text>
<text x="28" y="196" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182e31">Readiness profile, each area scored 0 to 3</text>
<text x="28" y="234" font-family="Arial,sans-serif" font-size="24" fill="#465958">Four questions per area.</text>
<text x="28" y="265" font-family="Arial,sans-serif" font-size="24" fill="#465958">Yes scores 3, partly 1, no 0.</text>
<text x="28" y="296" font-family="Arial,sans-serif" font-size="24" fill="#465958">Add the four answers, divide by four, round down.</text>
<text x="316" y="349" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#465958" text-anchor="middle">0</text>
<text x="437.333" y="349" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#465958" text-anchor="middle">1</text>
<text x="558.667" y="349" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#465958" text-anchor="middle">2</text>
<text x="680" y="349" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#465958" text-anchor="middle">3</text>
<path d="M437.33 363 V915" fill="none" stroke="#d8d1c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M558.67 363 V915" fill="none" stroke="#d8d1c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M680.00 363 V915" fill="none" stroke="#d8d1c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="316" y="375" width="242.667" height="44" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="544.67" y="406" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#134e4a" text-anchor="end">2</text>
<text x="28" y="405" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Data</text>
<rect x="316" y="453" width="242.667" height="44" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="544.67" y="484" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#134e4a" text-anchor="end">2</text>
<text x="28" y="468" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Integration and</text>
<text x="28" y="498" font-family="Arial,sans-serif" font-size="24" fill="#182e31">tools</text>
<rect x="316" y="539" width="121.333" height="44" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
<text x="423.33" y="570" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#881337" text-anchor="end">1</text>
<text x="28" y="554" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Identity and</text>
<text x="28" y="584" font-family="Arial,sans-serif" font-size="24" fill="#182e31">registry</text>
<rect x="316" y="617" width="121.333" height="44" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
<text x="423.33" y="648" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#881337" text-anchor="end">1</text>
<text x="28" y="647" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Controls on actions</text>
<rect x="316" y="695" width="242.667" height="44" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="544.67" y="726" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#134e4a" text-anchor="end">2</text>
<text x="28" y="710" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Testing and</text>
<text x="28" y="740" font-family="Arial,sans-serif" font-size="24" fill="#182e31">operations</text>
<rect x="316" y="773" width="121.333" height="44" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
<text x="423.33" y="804" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#881337" text-anchor="end">1</text>
<text x="28" y="803" font-family="Arial,sans-serif" font-size="24" fill="#182e31">Cost and value</text>
<rect x="316" y="851" width="242.667" height="44" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
<text x="544.67" y="882" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#134e4a" text-anchor="end">2</text>
<text x="28" y="866" font-family="Arial,sans-serif" font-size="24" fill="#182e31">People and operating</text>
<text x="28" y="896" font-family="Arial,sans-serif" font-size="24" fill="#182e31">model</text>
<path d="M316 363 V915" fill="none" stroke="#182e31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="449.33" y="955" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">Lowest score: 1</text>
<text x="48" y="1017" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182e31">The ceiling table</text>
<rect x="48" y="1039" width="644" height="98" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="64" y="1079" font-family="Arial,sans-serif" font-size="24" fill="#465958">Any area at 0</text>
<text x="64" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">-&gt; A1</text>
<rect x="48" y="1147" width="644" height="128" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
<text x="64" y="1187" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">Data and integration at 2 or more, all others</text>
<text x="64" y="1217" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">at 1 or more</text>
<text x="64" y="1253" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#881337">-&gt; A2</text>
<rect x="48" y="1285" width="644" height="128" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="64" y="1325" font-family="Arial,sans-serif" font-size="24" fill="#465958">Data, integration, identity, controls and</text>
<text x="64" y="1355" font-family="Arial,sans-serif" font-size="24" fill="#465958">testing at 2 or more, others at 1 or more</text>
<text x="64" y="1391" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">-&gt; A3</text>
<rect x="48" y="1423" width="644" height="158" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="64" y="1463" font-family="Arial,sans-serif" font-size="24" fill="#465958">All seven at 2 or more, with controls, testing</text>
<text x="64" y="1493" font-family="Arial,sans-serif" font-size="24" fill="#465958">and cost at 3</text>
<text x="64" y="1529" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">-&gt; A4, with L2 governed learning and the</text>
<text x="64" y="1559" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">oversight-capacity gate</text>
<rect x="48" y="1591" width="644" height="98" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="64" y="1631" font-family="Arial,sans-serif" font-size="24" fill="#465958">All seven at 3, plus regulator-ready evidence</text>
<text x="64" y="1667" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">-&gt; A5 candidacy, per domain only</text>
<path d="M437.33 363 V961 H18 V1211 H40" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 7" marker-end="url(#ah-risk)"/>
<text x="28" y="1729" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">Data and integration are at 2. Every other area is</text>
<text x="28" y="1760" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#182e31">at least 1. So the A2 row applies.</text>
<text x="28" y="1797" font-family="Arial,sans-serif" font-size="24" fill="#465958">To reach A3, identity and controls</text>
<text x="28" y="1828" font-family="Arial,sans-serif" font-size="24" fill="#465958">must also reach 2.</text>
<rect x="48" y="1873" width="644" height="178" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="64" y="1913" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1e293b">Overrides</text>
<text x="64" y="1949" font-family="Arial,sans-serif" font-size="24" fill="#465958">Tier 3 workload: controls at 3 for A3 or above</text>
<text x="64" y="1987" font-family="Arial,sans-serif" font-size="24" fill="#465958">Untrusted input + sensitive data + external</text>
<text x="64" y="2017" font-family="Arial,sans-serif" font-size="24" fill="#465958">action: capped at A2</text>
<text x="28" y="2101" font-family="Arial,sans-serif" font-size="24" fill="#465958">Northstar is a fictional teaching example.</text>
<text x="28" y="2132" font-family="Arial,sans-serif" font-size="24" fill="#465958">Read the profile, not the total.</text>
</svg>
