<text x="24" y="100" font-family="Arial,sans-serif" font-size="24" fill="#465958">The layers are what you own. The planes are what</text>
<text x="24" y="132" font-family="Arial,sans-serif" font-size="24" fill="#465958">you build across them.</text>
