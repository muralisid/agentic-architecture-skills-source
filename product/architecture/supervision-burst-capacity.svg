<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Supervision capacity at burst</title>
<desc id="desc">Fan-out, how many agents one supervisor can watch, equals neglect time divided by interaction time plus wait time, plus one. Leaving wait time out overstates capacity by up to 67 percent. A timeline shows routine exceptions, then a burst that crosses the capacity line in the busiest ten minutes while the daily average still looks fine. The system degrades safely, then recovers.</desc>
<defs>
<marker id="ah182e31" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#182e31"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="898" fill="#f8f5ef"/>
<text x="32" y="50" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#182e31">Supervision capacity at burst</text>
<text x="32" y="84" font-family="Arial,sans-serif" font-size="20" fill="#465958">Size oversight for the busiest ten minutes, with wait time counted. Never use a daily average.</text>
<rect x="32" y="102" width="1536" height="70" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="56" y="149" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#182e31">Fan-out = neglect time / (interaction time + <tspan fill="#e11d48">wait time</tspan>) + 1</text>
<rect x="32" y="186" width="375" height="138" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="48" y="221.8" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#182e31">Fan-out</text>
<text x="48" y="255.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">How many agents one supervisor can</text>
<text x="48" y="278.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">watch at once.</text>
<rect x="419" y="186" width="375" height="138" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="435" y="221.8" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#182e31">Neglect time</text>
<text x="435" y="255.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">How long an agent can safely run</text>
<text x="435" y="278.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">unattended.</text>
<rect x="806" y="186" width="375" height="138" rx="12" fill="#ffffff" stroke="#d5d9d4" stroke-width="2"/>
<text x="822" y="221.8" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#182e31">Interaction time</text>
<text x="822" y="255.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">How long a person needs per</text>
<text x="822" y="278.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">intervention.</text>
<rect x="1193" y="186" width="375" height="138" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1209" y="221.8" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#881337">Wait time</text>
<text x="1209" y="255.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">The term people drop. Leaving it</text>
<text x="1209" y="278.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">out overstates capacity by up to</text>
<text x="1209" y="301.2" font-family="Arial,sans-serif" font-size="18" fill="#465958">67 percent.</text>
<text x="32" y="358" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#182e31">Items needing a person, per ten minutes</text>
