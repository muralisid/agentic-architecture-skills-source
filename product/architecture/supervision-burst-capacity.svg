<text x="689" y="380" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">The busiest ten minutes</text>
<text x="1530" y="522.32" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="end">Capacity: what reviewers can clear in ten minutes, wait time counted</text>
<text x="92" y="628.02" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#465958">Daily average: looks fine on the dashboard</text>
<text x="805" y="460.16" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#881337">Over capacity: the queue and wait times grow</text>
<text x="1542" y="722" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#182e31">Time</text>
<text x="90" y="746" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#182e31">Routine</text>
<text x="90" y="771" font-family="Arial,sans-serif" font-size="18" fill="#465958">Exceptions arrive within staffed</text>
<text x="90" y="794" font-family="Arial,sans-serif" font-size="18" fill="#465958">capacity.</text>
<text x="525" y="746" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#182e31">Burst</text>
<text x="525" y="771" font-family="Arial,sans-serif" font-size="18" fill="#465958">Exceptions arrive</text>
<text x="525" y="794" font-family="Arial,sans-serif" font-size="18" fill="#465958">together and exceed</text>
<text x="525" y="817" font-family="Arial,sans-serif" font-size="18" fill="#465958">capacity.</text>
<text x="771.5" y="746" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#182e31">Degrade</text>
<text x="771.5" y="771" font-family="Arial,sans-serif" font-size="18" fill="#465958">Pause, narrow permissions or</text>
<text x="771.5" y="794" font-family="Arial,sans-serif" font-size="18" fill="#465958">return work to people.</text>
<text x="1134" y="746" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#182e31">Recover</text>
<text x="1134" y="771" font-family="Arial,sans-serif" font-size="18" fill="#465958">Clear the backlog and verify before</text>
<text x="1134" y="794" font-family="Arial,sans-serif" font-size="18" fill="#465958">restoring autonomy.</text>
<text x="32" y="884" font-family="Arial,sans-serif" font-size="18" fill="#465958">No credible human-to-agent supervision ratio is published. Use your own measured wait times.</text>
</svg>
