<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2994" role="img" aria-labelledby="title desc">
<title id="title">Risk profile: factors to tier</title>
<desc id="desc">Nine factors are each scored Low, Medium or High. The worst factor sets Tier 1 (basic), Tier 2 (enhanced) or Tier 3 (strict). Zone actions, destroying anything in production, code on production, regulated data and decisions about people are always High. A fixed zone action that can be undone, named in the signed register, sits at Tier 2. Oversight adds controls only. The Rule of Two caps autonomy at delegated tasks (A2). A multi-agent system takes its highest member's tier. When unsure, go up.</desc>
<defs>
<marker id="ah-control" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker>
<marker id="ah-neutral" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94a3b8"/></marker>
<marker id="ah-risk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#e11d48"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="28" y="64" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">Risk profile: factors to tier</text>
<text x="28" y="110" font-family="Arial,sans-serif" font-size="24" fill="#465958">Each factor is Low, Medium or High. The worst</text>
<text x="28" y="142" font-family="Arial,sans-serif" font-size="24" fill="#465958">factor sets the tier.</text>
<rect x="28" y="176" width="664" height="86" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="44" y="227" font-family="Arial,sans-serif" font-size="24" fill="#182e31">1. Autonomy</text>
