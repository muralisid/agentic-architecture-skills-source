<text x="630" y="227.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#881337">High</text>
<rect x="474" y="199" width="100" height="40" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="524" y="227.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Medium</text>
<rect x="368" y="199" width="100" height="40" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="418" y="227.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#1e293b">Low</text>
