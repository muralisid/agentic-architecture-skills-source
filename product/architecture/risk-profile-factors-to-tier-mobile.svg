<text x="44" y="308" font-family="Arial,sans-serif" font-size="24" fill="#182e31">2. What its own</text>
<text x="44" y="338" font-family="Arial,sans-serif" font-size="24" fill="#182e31">credentials let it do</text>
<rect x="580" y="295" width="100" height="40" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="630" y="323.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#881337">High</text>
<rect x="474" y="295" width="100" height="40" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="524" y="323.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Medium</text>
<rect x="368" y="295" width="100" height="40" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="418" y="323.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#1e293b">Low</text>
<rect x="28" y="368" width="664" height="86" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="44" y="419" font-family="Arial,sans-serif" font-size="24" fill="#182e31">3. Systems it can reach</text>
<rect x="580" y="391" width="100" height="40" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="630" y="419.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#881337">High</text>
<rect x="474" y="391" width="100" height="40" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="524" y="419.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Medium</text>
<rect x="368" y="391" width="100" height="40" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="418" y="419.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#1e293b">Low</text>
<rect x="28" y="464" width="664" height="86" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="44" y="500" font-family="Arial,sans-serif" font-size="24" fill="#182e31">4. Whether the effect</text>
<text x="44" y="530" font-family="Arial,sans-serif" font-size="24" fill="#182e31">can be undone</text>
<rect x="580" y="487" width="100" height="40" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="630" y="515.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#881337">High</text>
<rect x="474" y="487" width="100" height="40" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="524" y="515.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Medium</text>
<rect x="368" y="487" width="100" height="40" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="418" y="515.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#1e293b">Low</text>
<rect x="28" y="560" width="664" height="86" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="44" y="596" font-family="Arial,sans-serif" font-size="24" fill="#182e31">5. How far the effect</text>
<text x="44" y="626" font-family="Arial,sans-serif" font-size="24" fill="#182e31">spreads</text>
<rect x="580" y="583" width="100" height="40" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="630" y="611.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#881337">High</text>
<rect x="474" y="583" width="100" height="40" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="524" y="611.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Medium</text>
<rect x="368" y="583" width="100" height="40" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="418" y="611.6" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#1e293b">Low</text>
