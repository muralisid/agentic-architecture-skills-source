<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Stepping autonomy up and down</title>
<desc id="desc">Autonomy runs from A0 manual to A5 governed lights-out. Each step up needs the controls in place, eval results and the readiness scores for that level, never a count of clean runs, and A4 and above also need L2 governed learning and an oversight gate proven at burst. An anomaly, a change of scope or exercised autonomy above permitted demotes the agent at once. Each agent carries three readings: designed, permitted and exercised.</desc>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="40" y="52" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#182e31">Stepping autonomy up and down</text>
<text x="40" y="84" font-family="Arial,sans-serif" font-size="20" fill="#465958">Step up on controls and eval results, never on a count of clean runs. Step down at once.</text>
<text x="40" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#465958">Level and the human's job</text>
<text x="372" y="128" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#465958">To step up to this level</text>
<rect x="40" y="142" width="316" height="94" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="52" y="170" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">A5 Governed lights-out</text>
<text x="52" y="197.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Sets policy, audits outcomes</text>
<rect x="372" y="142" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="172" font-family="Arial,sans-serif" font-size="18" fill="#465958">All six readiness areas at 3, plus</text>
<text x="386" y="195" font-family="Arial,sans-serif" font-size="18" fill="#465958">regulator-ready evidence. Oversight capacity</text>
<text x="386" y="218" font-family="Arial,sans-serif" font-size="18" fill="#465958">measured in production. Per domain only.</text>
<rect x="875.2" y="154" width="142.8" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="946.6" y="175.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Tier 3 floor</text>
<rect x="40" y="246" width="316" height="94" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="52" y="274" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">A4 Managed autonomy</text>
<text x="52" y="301.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Works exception queues</text>
<rect x="372" y="246" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="276" font-family="Arial,sans-serif" font-size="18" fill="#465958">L2 governed learning. Pass the oversight gate</text>
<text x="386" y="299" font-family="Arial,sans-serif" font-size="18" fill="#465958">below. All six areas at 2 or more, operations</text>
<text x="386" y="322" font-family="Arial,sans-serif" font-size="18" fill="#465958">and governance at 3.</text>
<rect x="875.2" y="258" width="142.8" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="946.6" y="279.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Tier 3 floor</text>
<rect x="40" y="386" width="316" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="52" y="414" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">A3 Supervised autonomy</text>
<text x="52" y="441.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Approves irreversible actions</text>
<rect x="372" y="386" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="416" font-family="Arial,sans-serif" font-size="18" fill="#465958">Data, integration, identity and operations at 2</text>
<text x="386" y="439" font-family="Arial,sans-serif" font-size="18" fill="#465958">or more. Approval gates, budgets, a kill switch,</text>
<text x="386" y="462" font-family="Arial,sans-serif" font-size="18" fill="#465958">and evals against a human baseline.</text>
<rect x="875.2" y="398" width="142.8" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="946.6" y="419.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Tier 2 floor</text>
<rect x="40" y="490" width="316" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="52" y="518" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">A2 Delegated tasks</text>
<text x="52" y="545.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Reviews every output</text>
<rect x="372" y="490" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="520" font-family="Arial,sans-serif" font-size="18" fill="#465958">Data and integration at 2 or more, the rest at 1</text>
<text x="386" y="543" font-family="Arial,sans-serif" font-size="18" fill="#465958">or more. Task scoping, output review and audit.</text>
<rect x="875.2" y="502" width="142.8" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="946.6" y="523.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Tier 1 floor</text>
<rect x="40" y="594" width="316" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="52" y="622" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">A1 Assisted</text>
<text x="52" y="649.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Acts; AI suggests</text>
<rect x="372" y="594" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="624" font-family="Arial,sans-serif" font-size="18" fill="#465958">Can start while the identity chain is built. Any</text>
<text x="386" y="647" font-family="Arial,sans-serif" font-size="18" fill="#465958">area at 0 keeps the agent here.</text>
<rect x="875.2" y="606" width="142.8" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="946.6" y="627.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">Tier 1 floor</text>
<rect x="40" y="698" width="316" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="52" y="726" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">A0 Manual</text>
<text x="52" y="753.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">All work, no AI</text>
<rect x="372" y="698" width="658" height="94" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="386" y="728" font-family="Arial,sans-serif" font-size="18" fill="#465958">The starting point.</text>
<rect x="914.8" y="710" width="103.2" height="30" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="966.4" y="731.3" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1e293b">No floor</text>
<path d="M36 363 L1034 363" fill="none" stroke="#475569" stroke-width="4"/>
<rect x="337.9" y="347" width="394.3" height="32" rx="16" fill="#f8f5ef" stroke="#475569" stroke-width="2"/>
<text x="535" y="369" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Oversight gate: burst capacity proven</text>
<rect x="1050" y="112" width="510" height="148.6" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1066" y="144" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#881337">Step down at once</text>
<text x="1066" y="171.4" font-family="Arial,sans-serif" font-size="18" fill="#465958">Any one of these demotes the agent:</text>
<text x="1082" y="194.3" font-family="Arial,sans-serif" font-size="18" fill="#881337">An anomaly</text>
<circle cx="1071" cy="188.5" r="3.5" fill="#881337"/>
<text x="1082" y="217.2" font-family="Arial,sans-serif" font-size="18" fill="#881337">A change of scope</text>
<circle cx="1071" cy="211.4" r="3.5" fill="#881337"/>
<text x="1082" y="240.1" font-family="Arial,sans-serif" font-size="18" fill="#881337">Exercised above permitted: an incident</text>
<circle cx="1071" cy="234.3" r="3.5" fill="#881337"/>
<path d="M1520 134 L1520 224.6" fill="none" stroke="#e11d48" stroke-width="5"/>
<path d="M1508 220.60000000000002 L1520 238.60000000000002 L1532 220.60000000000002 Z" fill="#e11d48"/>
<rect x="1050" y="274.6" width="510" height="125.9" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="1066" y="306.6" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Step up on evidence</text>
<text x="1066" y="334" font-family="Arial,sans-serif" font-size="18" fill="#465958">Controls in place and eval results. Never a</text>
<text x="1066" y="357" font-family="Arial,sans-serif" font-size="18" fill="#465958">count of clean runs: nineteen passes in twenty</text>
<text x="1066" y="380" font-family="Arial,sans-serif" font-size="18" fill="#465958">fits a true pass rate as low as 78 percent.</text>
<path d="M1520 378.5 L1520 310.6" fill="none" stroke="#475569" stroke-width="5"/>
<path d="M1508 314.6 L1520 296.6 L1532 314.6 Z" fill="#475569"/>
<rect x="1050" y="414.5" width="510" height="377.5" rx="12" fill="#fff" stroke="#d5d9d4" stroke-width="1.5"/>
<text x="1066" y="446.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#182e31">One agent, three readings</text>
<rect x="1066" y="466.5" width="103.2" height="30" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1117.6" y="487.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Designed</text>
<text x="1066" y="516.9" font-family="Arial,sans-serif" font-size="18" fill="#465958">what the build allows</text>
<rect x="1066" y="538.5" width="113.1" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="1122.5" y="559.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Permitted</text>
<text x="1066" y="588.9" font-family="Arial,sans-serif" font-size="18" fill="#465958">what this contract grants</text>
<rect x="1066" y="610.5" width="113.1" height="30" rx="15" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="1122.5" y="631.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#881337">Exercised</text>
<text x="1066" y="660.9" font-family="Arial,sans-serif" font-size="18" fill="#465958">what the logs show</text>
<text x="1345.8" y="480.9" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">Example</text>
<path d="M1383.6 513.5 L1383.6 683.5" fill="none" stroke="#94a3b8" stroke-width="2"/>
<text x="1345.8" y="519.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A5</text>
<circle cx="1383.6" cy="513.5" r="4" fill="#94a3b8"/>
<text x="1345.8" y="553.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A4</text>
<circle cx="1383.6" cy="547.5" r="4" fill="#94a3b8"/>
<rect x="1397.6" y="532.5" width="103.2" height="30" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1449.2" y="553.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1e293b">Designed</text>
<text x="1345.8" y="587.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A3</text>
<circle cx="1383.6" cy="581.5" r="4" fill="#94a3b8"/>
<rect x="1397.6" y="566.5" width="113.1" height="30" rx="15" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="1454.1" y="587.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">Permitted</text>
<text x="1345.8" y="621.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A2</text>
<circle cx="1383.6" cy="615.5" r="4" fill="#94a3b8"/>
<rect x="1397.6" y="600.5" width="113.1" height="30" rx="15" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="1454.1" y="621.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#881337">Exercised</text>
<text x="1345.8" y="655.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A1</text>
<circle cx="1383.6" cy="649.5" r="4" fill="#94a3b8"/>
<text x="1345.8" y="689.8" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182e31">A0</text>
<circle cx="1383.6" cy="683.5" r="4" fill="#94a3b8"/>
<text x="1066" y="730.9" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#881337">Exercised above permitted is an incident.</text>
<text x="1066" y="753.9" font-family="Arial,sans-serif" font-size="18" fill="#182e31">Controls follow the higher of the two.</text>
<text x="40" y="836" font-family="Arial,sans-serif" font-size="18" fill="#465958">Every move on the A0 to A5 scale is a change. It re-runs the evals and the risk profile.</text>
<text x="40" y="862" font-family="Arial,sans-serif" font-size="18" fill="#465958">The weakest readiness area sets the ceiling. A level you cannot supervise is a level you have not reached.</text>
</svg>
