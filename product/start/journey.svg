<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">The road to an agentic enterprise</title>
<desc id="desc">Seven steps run in order. They are understand, assess readiness, choose use cases, design, build, operate and scale autonomy. Each step lists the pages to read. A gate sits between each pair of steps. Gate 1: sponsors can say what changes and what stays. Gate 2: a readiness profile and ceiling. Gate 3: the use case is admitted and its risk tier set. Gate 4: the zone register is signed and controls chosen. Gate 5: evals pass and approvals are signed. Gate 6: oversight capacity holds at peak load. A rail under every step reads evidence and limits on every page. An arrow from step 7 back to step 3 marks the next use case.</desc>
