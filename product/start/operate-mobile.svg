<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc">
<title id="title">Operate, every week</title>
<desc id="desc">Four checks run in a loop every week. Observability watches traces the agent cannot forge, costs and incidents. It sits in the observability and FinOps layer (R12). Cost tracks cost per resolved outcome, budgets and circuit breakers. Supervision runs the exception queues and checks capacity at burst. It sits in the operating model and supervision layer (R13). Lifecycle handles change triggers, periodic review and retirement. Then the loop starts again. The gate for step 6 is that oversight capacity holds at peak load, not just on an average day.</desc>
