<text x="104" y="1610" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">The Agentic OS</text>
<text x="104" y="1644" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">The learning flywheel</text>
