<text x="160" y="191" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">Understand</text>
<path d="M96 218 H624" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.35"/>
<text x="104" y="252" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">Architecture of the agentic enterprise</text>
<text x="104" y="286" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">The seven responsibilities</text>
<text x="104" y="320" font-family="Arial,sans-serif" font-size="24" fill="#1e3a8a">Follow one inspection task</text>
