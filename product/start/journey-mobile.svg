<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2694" role="img" aria-labelledby="title desc">
<title id="title">The road to an agentic enterprise</title>
<desc id="desc">Seven stations run in order: 1 Understand, 2 Assess readiness, 3 Choose use cases, 4 Design, 5 Build, 6 Operate and 7 Scale autonomy. Each station lists the pages to read. A gate sits between stations: sponsors can say what changes and what stays; readiness profile and ceiling; use case admitted, risk tier set; zone register signed, controls chosen; evals pass, approvals signed; oversight capacity proven at burst. An evidence rail runs under every station, and an arrow from station 7 back to station 3 marks the next use case.</desc>
<defs><marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker></defs>
<rect width="100%" height="100%" fill="#f8f5ef"/>
<text x="32" y="64" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#182e31">The road to an agentic enterprise</text>
<text x="32" y="104" font-family="Arial,sans-serif" font-size="24" fill="#465958">Seven stations, with a gate between each.</text>
