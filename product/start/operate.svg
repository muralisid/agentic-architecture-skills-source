<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 898" role="img" aria-labelledby="title desc">
<title id="title">Operate, every week</title>
<desc id="desc">Four jobs run in a loop every week. Observability watches traces the agent cannot forge, costs and incidents, in layer R12. Cost tracks cost per resolved outcome, budgets and circuit breakers. Supervision runs the exception queues and checks capacity at burst, in layer R13, and Lifecycle handles change triggers, periodic review and retirement before the loop starts again.</desc>
